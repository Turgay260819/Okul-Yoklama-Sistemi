<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yoklama Fişleri</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", monospace;
        background: #f0f4f8;
      }

      /* EKRAN KONTROL PANELİ */
      .kontrol {
        background: white;
        padding: 14px 20px;
        border-bottom: 2px solid #ddd;
        display: flex;
        gap: 12px;
        align-items: flex-end;
        flex-wrap: wrap;
      }

      .kontrol h1 {
        width: 100%;
        font-size: 16px;
        font-family: "Segoe UI", sans-serif;
        color: #333;
        margin-bottom: 6px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .form-group label {
        font-size: 11px;
        color: #666;
        font-weight: 600;
        font-family: "Segoe UI", sans-serif;
      }

      .form-group input,
      .form-group select {
        padding: 7px 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 13px;
        font-family: "Segoe UI", sans-serif;
        outline: none;
      }

      .btn {
        padding: 8px 18px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: "Segoe UI", sans-serif;
      }
      .btn-mavi {
        background: #1a73e8;
        color: white;
      }
      .btn-yesil {
        background: #34a853;
        color: white;
      }
      .btn-gri {
        background: #666;
        color: white;
      }

      #durum {
        width: 100%;
        font-size: 12px;
        color: #666;
        font-family: "Segoe UI", sans-serif;
        margin-top: 4px;
      }

      #yazdir-alani {
        padding: 16px;
        background: #f0f4f8;
      }

      .bos-mesaj {
        text-align: center;
        color: #999;
        padding: 40px;
        font-family: "Segoe UI", sans-serif;
        font-size: 14px;
      }

      /* A4 SAYFA */
      .a4-sayfa {
        width: 210mm;
        height: 297mm;
        max-height: 297mm;
        overflow: hidden;
        background: white;
        margin: 0 auto 16px auto;
        padding: 4mm;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
      }

      /* SAYFA BAŞLIĞI */
      .sayfa-baslik {
        text-align: center;
        padding-bottom: 3mm;
        margin-bottom: 3mm;
        border-bottom: 1.5px solid #222;
      }

      .sayfa-baslik .okul-adi {
        font-size: 11pt;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #000;
      }

      .sayfa-baslik .alt-baslik {
        font-size: 8.5pt;
        color: #444;
        margin-top: 1mm;
      }

      /* FİŞ GRID - 2 sütun 2 satır = 4 şube/sayfa */
      .fis-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 2mm;
        flex: 1;
        overflow: hidden;
      }

      /* TEK FİŞ */
      .fis {
        border: 1px solid #333;
        padding: 2mm;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }

      .fis-bos {
        border: 1px dashed #ccc;
        opacity: 0.25;
      }

      .fis-bilgi {
        display: flex;
        justify-content: space-between;
        font-size: 8pt;
        font-weight: 700;
        border-bottom: 0.5px solid #555;
        padding-bottom: 1mm;
        margin-bottom: 1.5mm;
        color: #000;
      }

      .fis-tablo {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        flex: 1;
      }

      .fis-tablo td {
        border: 0.5px solid #555;
        text-align: center;
        padding: 0;
        overflow: hidden;
        white-space: nowrap;
        color: #000;
      }

      /* Etiket sütunu */
      .etiket {
        text-align: left !important;
        padding-left: 1.5mm !important;
        font-weight: 700;
        background: #efefef;
        font-size: 6.5pt;
        color: #333;
        width: 7mm;
      }

      /* Ders başlık satırları */
      .dh {
        background: #efefef;
        font-weight: 700;
        font-size: 6.5pt;
        height: 3.5mm;
        line-height: 3.5mm;
      }

      /* Yok satırı */
      .yh {
        vertical-align: top;
        padding: 0.5mm !important;
      }
      .yh-ic {
        max-height: 25mm;
        overflow: hidden;
        font-size: 6pt;
        line-height: 1.15;
        word-break: break-all;
      }

      /* İmza satırı */
      .ih {
        height: 3mm;
      }

      /* Alt kısım */
      .fis-alt {
        display: flex;
        justify-content: flex-end;
        margin-top: 1.5mm;
        padding-top: 1mm;
        border-top: 0.5px solid #555;
      }

      .incelendi {
        border: 0.5px solid #555;
        padding: 0.5mm 2mm;
        font-size: 6.5pt;
        text-align: center;
        color: #444;
        line-height: 1.5;
        min-width: 28mm;
      }

      .incelendi strong {
        font-size: 7pt;
        color: #000;
        display: block;
      }

      .imza-cizgi {
        border-top: 0.5px dotted #888;
        margin-top: 1.5mm;
        height: 4mm;
      }

      /* YAZDIR */
      @page { size: A4; margin: 10mm 12mm; }

      @media print {
        * {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        body {
          background: white;
        }
        .fis-grid {
          height: calc(297mm - 20mm - 25mm);
        }

        .fis {
          overflow: hidden;
          min-height: 0;
        }

        .kontrol {
          display: none !important;
        }

        #yazdir-alani {
          padding: 0;
          background: white;
        }

        .a4-sayfa {
          width: 100%;
          min-height: 0;
          max-height: calc(297mm - 20mm);
          height: calc(297mm - 20mm);
          overflow: hidden;
          page-break-inside: avoid;
          break-inside: avoid;
          margin: 0;
          padding: 4mm;
          box-shadow: none;
          page-break-after: always;
          break-after: page;
        }

        .a4-sayfa:last-child {
          page-break-after: auto;
          break-after: auto;
        }
      }
    </style>
    <script>if(new URLSearchParams(location.search).get("embedded"))document.addEventListener("DOMContentLoaded",()=>document.querySelector("h1")?.remove());</script>
  </head>
  <body>
    <!-- KONTROL PANELİ -->
    <div class="kontrol">
      <h1>Yoklama Fişleri</h1>

      <div class="form-group">
        <label>Tarih</label>
        <input type="date" id="tarih" />
      </div>

      <div class="form-group">
        <label>Sınıf Seviyesi</label>
        <select id="seviye">
          <option value="hepsi">Tüm Seviyeler (4 sayfa)</option>
          <option value="5">Sadece 5. Sınıflar</option>
          <option value="6">Sadece 6. Sınıflar</option>
          <option value="7">Sadece 7. Sınıflar</option>
          <option value="8">Sadece 8. Sınıflar</option>
        </select>
      </div>

      <button class="btn btn-mavi" onclick="fisleriOlustur()">
        Fişleri Oluştur
      </button>
      <button class="btn btn-yesil" onclick="window.print()">Yazdır</button>

      <div id="durum"></div>
    </div>

    <div id="yazdir-alani">
      <div class="bos-mesaj">
        Tarih seçip "Fişleri Oluştur" butonuna tıklayın.
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import {
        getFirestore,
        getDocs,
        collection,
        query,
        where,
        orderBy,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAHTCiicd4b94rG1-jN0STRbwcrLmkYudo",
        authDomain: "okul-yoklama-sistemi-8081f.firebaseapp.com",
        projectId: "okul-yoklama-sistemi-8081f",
        storageBucket: "okul-yoklama-sistemi-8081f.firebasestorage.app",
        messagingSenderId: "38230047763",
        appId: "1:38230047763:web:dfab058df8928b66be13e6",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const OKUL_ADI = "AHMET YENİCE ORTAOKULU";
      const MUDUR_YARDIMCISI = "T. YIKILMAZ";

      // Bugünü varsayılan yap
      const bugun = new Date().toISOString().split("T")[0];
      document.getElementById("tarih").value = bugun;

      onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "/portal.html";
      });

      // Tarih formatlama
      function formatTarih(t) {
        const d = new Date(t + "T12:00:00");
        const gunler = [
          "Pazar",
          "Pazartesi",
          "Salı",
          "Çarşamba",
          "Perşembe",
          "Cuma",
          "Cumartesi",
        ];
        const g = String(d.getDate()).padStart(2, "0");
        const a = String(d.getMonth() + 1).padStart(2, "0");
        return `${g}.${a}.${d.getFullYear()} ${gunler[d.getDay()]}`;
      }

      // Öğretmen kısaltması
      function kisalt(ad) {
        if (!ad) return "—";
        const p = ad.trim().split(" ");
        if (p.length === 1) return p[0].substring(0, 5).toUpperCase();
        const soyad = p[p.length - 1].toUpperCase();
        return p[0].charAt(0).toUpperCase() + "." + soyad.substring(0, 3);
      }

      window.fisleriOlustur = async () => {
        const tarih = document.getElementById("tarih").value;
        const seviye = document.getElementById("seviye").value;
        const durum = document.getElementById("durum");
        const alan = document.getElementById("yazdir-alani");

        if (!tarih) {
          durum.textContent = "Lütfen tarih seçin.";
          return;
        }

        durum.textContent = "⏳ Veriler yükleniyor...";
        alan.innerHTML =
          '<div class="bos-mesaj">⏳ Fişler hazırlanıyor...</div>';

        try {
          // Sınıfları getir
          const sinifSnap = await getDocs(collection(db, "classes"));
          let siniflar = [];
          sinifSnap.forEach((d) => siniflar.push({ id: d.id, ...d.data() }));
          siniflar.sort((a, b) => {
            if (a.grade !== b.grade) return a.grade - b.grade;
            return a.class_name.localeCompare(b.class_name);
          });

          // Öğretmenleri getir
          const ogSnap = await getDocs(collection(db, "teachers"));
          const ogretmenler = {};
          ogSnap.forEach((d) => (ogretmenler[d.id] = d.data()));

          // Ders programını getir
          const progSnap = await getDocs(collection(db, "schedule"));
          const program = {};
          progSnap.forEach((d) => {
            const veri = d.data();
            const key = (veri.class_id || "").trim().toUpperCase();
            if (!program[key]) program[key] = [];
            program[key].push(veri);
          });

          // Yoklamaları getir
          const yokSnap = await getDocs(
            query(collection(db, "attendance"), where("date", "==", tarih)),
          );
          const yoklamalar = {};
          yokSnap.forEach((d) => {
            const veri = d.data();
            const key = (veri.class_id || "").trim().toUpperCase();
            if (!yoklamalar[key]) yoklamalar[key] = {};
            yoklamalar[key][veri.lesson_number] = veri.absent_students || [];
          });

          // Hangi seviyeleri işleyeceğiz
          const seviyeler =
            seviye === "hepsi" ? [5, 6, 7, 8] : [parseInt(seviye)];
          const tarihStr = formatTarih(tarih);
          let toplamSayfa = 0;
          let html = "";

          // Tek fiş HTML üretici (hem yoklama fisi1 hem fisi2 için)
          function fisSayfasiHtml(sev, sayfaNo, buSeviyeSiniflari, tarihStr) {
            const baslangic = sayfaNo * 4;
            if (baslangic >= buSeviyeSiniflari.length) return "";
            const subeAdi = buSeviyeSiniflari[baslangic]?.class_name + (buSeviyeSiniflari[baslangic + 3] ? "–" + (buSeviyeSiniflari[Math.min(baslangic + 3, buSeviyeSiniflari.length - 1)]?.class_name || "") : "");
            let h = `<div class="a4-sayfa">`;
            h += `<div class="sayfa-baslik">
        <div class="okul-adi">${OKUL_ADI} — ÖĞRENCİ GÜNLÜK YOKLAMA FİŞLERİ</div>
        <div class="alt-baslik">${sev}. SINIFLAR (${subeAdi}) — ${tarihStr}</div>
      </div>`;
            h += `<div class="fis-grid">`;
            for (let i = baslangic; i < baslangic + 4; i++) {
              const sinif = buSeviyeSiniflari[i];
              if (!sinif) { h += `<div class="fis fis-bos"></div>`; continue; }
              const sinifAdi = sinif.class_name;
              const sinifKey = sinifAdi.trim().toUpperCase();
              const sinifProgram = (program[sinifKey] || [])
                .sort((a, b) => a.lesson_number - b.lesson_number)
                .filter((d, idx, arr) => arr.findIndex((x) => x.lesson_number === d.lesson_number) === idx);
              const sinifYok = yoklamalar[sinifKey] || {};
              const n = sinifProgram.length;
              if (n === 0) {
                const dersNoListe = Object.keys(sinifYok).map(Number).filter(Boolean).sort((a, b) => a - b);
                if (dersNoListe.length === 0) {
                  h += `<div class="fis" style="max-height:100%;overflow:hidden;">
    <div class="fis-bilgi"><span>${sinifAdi}</span><span>${tarihStr.split(" ")[0]}</span></div>
    <div style="padding:2mm;font-size:7pt;color:#888;text-align:center;">Ders programı tanımlanmamış</div>
  </div>`;
                } else {
                  const dersW2 = Math.floor(93 / dersNoListe.length);
                  const colgroup2 = `<col style="width:7mm">${dersNoListe.map(() => `<col style="width:${dersW2}%">`).join("")}`;
                  const satRow2 = dersNoListe.map(d => `<td class="dh">${d}</td>`).join("");
                  const yokRow2 = dersNoListe.map(d => `<td class="yh"><div class="yh-ic">${(sinifYok[d] || []).join(" ")}</div></td>`).join("");
                  h += `<div class="fis">
    <div class="fis-bilgi"><span>${sinifAdi}</span><span>${tarihStr.split(" ")[0]}</span></div>
    <table class="fis-tablo">
      <colgroup>${colgroup2}</colgroup>
      <tr><td class="etiket">SAT</td>${satRow2}</tr>
      <tr><td class="etiket">YOK</td>${yokRow2}</tr>
    </table>
  </div>`;
                }
                continue;
              }
              const dersW = Math.floor(93 / n);
              let drsRow = "", satRow = "", yokRow = "", ogrRow = "", imzRow = "";
              for (let k = 0; k < n; k++) {
                const ders = sinifProgram[k];
                const dersNo = ders.lesson_number;
                const dersKisa = (ders.lesson_name || "").substring(0, 4).toUpperCase();
                const ogr = ogretmenler[ders.teacher_id];
                const ogrKisa = kisalt(ogr?.ad || "");
                const yokMetin = (sinifYok[dersNo] || []).join(" ");
                drsRow += `<td class="dh">${dersKisa}</td>`;
                satRow += `<td class="dh">${dersNo}</td>`;
                yokRow += `<td class="yh"><div class="yh-ic">${yokMetin}</div></td>`;
                ogrRow += `<td class="dh" style="font-size:6.5pt;">${ogrKisa}</td>`;
                imzRow += `<td class="ih"></td>`;
              }
              const colgroup = `<col style="width:7mm">${Array(n).fill(`<col style="width:${dersW}%">`).join("")}`;
              h += `<div class="fis">
          <div class="fis-bilgi"><span>${sinifAdi}</span><span>${tarihStr.split(" ")[0]}</span></div>
          <table class="fis-tablo">
            <colgroup>${colgroup}</colgroup>
            <tr><td class="etiket">DRS</td>${drsRow}</tr>
            <tr><td class="etiket">SAT</td>${satRow}</tr>
            <tr><td class="etiket">YOK</td>${yokRow}</tr>
            <tr><td class="etiket">ÖĞR</td>${ogrRow}</tr>
            <tr><td class="etiket">İMZ</td>${imzRow}</tr>
          </table>
          <div class="fis-alt">
            <div class="incelendi">
              <span>İNCELENDİ — MÜD.YARD.</span>
              <strong>${MUDUR_YARDIMCISI}</strong>
              <div class="imza-cizgi"></div>
            </div>
          </div>
        </div>`;
            }
            h += `</div></div>`;
            return h;
          }

          seviyeler.forEach((sev) => {
            const buSeviyeSiniflari = siniflar.filter((s) => s.grade === sev);
            if (buSeviyeSiniflari.length === 0) return;
            // Her seviye için 2 sayfa: sayfa 0 → şubeler 0-3, sayfa 1 → şubeler 4-7
            for (let sayfaNo = 0; sayfaNo < 2; sayfaNo++) {
              const sayfaHtml = fisSayfasiHtml(sev, sayfaNo, buSeviyeSiniflari, tarihStr);
              if (sayfaHtml) { html += sayfaHtml; toplamSayfa++; }
            }
          });

          alan.innerHTML =
            html || '<div class="bos-mesaj">Veri bulunamadı.</div>';
          durum.textContent = `✓ ${toplamSayfa} sayfa oluşturuldu. Yazdırmak için butona tıklayın.`;
        } catch (err) {
          console.error(err);
          durum.textContent = "Hata: " + err.message;
          alan.innerHTML =
            '<div class="bos-mesaj">Bir hata oluştu. Konsolu kontrol edin.</div>';
        }
      };
    </script>
  </body>
</html>
