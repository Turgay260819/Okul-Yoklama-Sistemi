<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Öğrenci Profil Sistemi</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Segoe UI", sans-serif; background: #f0f4f8; color: #1a1d2e; }
      @page { size: A4; margin: 12mm; }
      .topbar {
        background: #1557b0; color: white; padding: 13px 24px;
        display: flex; justify-content: space-between; align-items: center;
        flex-wrap: wrap; gap: 10px;
      }
      .topbar h1 { font-size: 16px; font-weight: 700; }
      .topbar-sag { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .btn {
        padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px;
        font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s;
      }
      .btn-beyaz { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
      .btn-beyaz:hover { background: rgba(255,255,255,0.25); }
      .btn-mavi { background: #1a73e8; color: white; }
      .btn-yesil { background: #34a853; color: white; }
      .btn-kirmizi { background: #ea4335; color: white; }
      .btn-gri { background: #666; color: white; }
      .btn-mor { background: #7c4dff; color: white; }
      .btn-sm { padding: 5px 12px; font-size: 12px; }
      .icerik { max-width: 1200px; margin: 0 auto; padding: 20px; }
      .kart {
        background: white; border-radius: 12px; padding: 20px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px;
      }
      .kart-baslik {
        font-size: 15px; font-weight: 700; color: #333; margin-bottom: 14px;
        padding-bottom: 10px; border-bottom: 1px solid #f0f0f0;
        display: flex; justify-content: space-between; align-items: center;
        flex-wrap: wrap; gap: 8px;
      }
      .sekme-bar {
        display: flex; gap: 4px; margin-bottom: 20px; background: white;
        border-radius: 12px; padding: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        flex-wrap: wrap;
      }
      .sekme-btn {
        padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px;
        font-weight: 600; color: #6b7280; border: none; background: none;
        font-family: inherit; transition: all 0.15s;
      }
      .sekme-btn.aktif { background: #1557b0; color: white; }
      .sekme-icerik { display: none; }
      .sekme-icerik.aktif { display: block; }
      .rozet { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
      .rozet-yesil { background: #e6f4ea; color: #1e7e34; }
      .rozet-kirmizi { background: #fce8e6; color: #c5221f; }
      .rozet-mavi { background: #e8f0fe; color: #1a73e8; }
      .rozet-sari { background: #fef7e0; color: #b06000; }
      .rozet-mor { background: #ede7f6; color: #5e35b1; }
      .rozet-gri { background: #f1f3f4; color: #555; }
      .form-group { margin-bottom: 14px; }
      .form-group label {
        display: block; font-size: 12px; font-weight: 700; color: #6b7280;
        margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em;
      }
      .form-group input, .form-group select, .form-group textarea {
        width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0;
        border-radius: 8px; font-size: 14px; font-family: inherit;
        outline: none; transition: border-color 0.15s;
      }
      .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #1a73e8; }
      .form-group textarea { resize: vertical; min-height: 70px; }
      .mesaj { padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-top: 10px; display: none; }
      .mesaj-basari { background: #e6f4ea; color: #1e7e34; display: block; }
      .mesaj-hata { background: #fce8e6; color: #c5221f; display: block; }
      .mesaj-bilgi { background: #e8f0fe; color: #1a73e8; display: block; }
      .yukleniyor { text-align: center; padding: 60px; color: #666; font-size: 15px; }
      .bos-mesaj { text-align: center; padding: 40px; color: #888; font-size: 14px; }
      .ogrenci-kart {
        background: white; border-radius: 10px; padding: 14px; margin-bottom: 8px;
        border: 2px solid #e0e0e0; cursor: pointer; transition: all 0.15s;
        display: flex; justify-content: space-between; align-items: center;
      }
      .ogrenci-kart:hover { border-color: #1a73e8; background: #f8fbff; }
      .ogrenci-kart.veri-var { border-color: #34a853; }
      .soru-kart {
        background: #f8f9fa; border-radius: 10px; padding: 16px;
        margin-bottom: 14px; border-left: 4px solid #1a73e8;
      }
      .soru-metin { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 10px; }
      .soru-satir { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
      .soru-satir input {
        flex: 1; padding: 8px 12px; border: 2px solid #e0e0e0;
        border-radius: 8px; font-size: 13px; font-family: inherit; outline: none;
      }
      .soru-satir input:focus { border-color: #1a73e8; }
      .istat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
      .istat-kart { background: white; border-radius: 10px; padding: 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
      .istat-sayi { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
      .istat-etiket { font-size: 12px; color: #888; font-weight: 600; }
      .ilerleme-wrap { margin-bottom: 8px; }
      .ilerleme-label { display: flex; justify-content: space-between; font-size: 12px; color: #555; margin-bottom: 4px; }
      .ilerleme-bar { height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; }
      .ilerleme-dolgu { height: 100%; border-radius: 5px; transition: width 0.3s; }
      .accordion-item { border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 6px; overflow: hidden; }
      .accordion-baslik {
        padding: 12px 16px; background: #f8f9fa; cursor: pointer;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 13px; font-weight: 600;
      }
      .accordion-icerik { display: none; padding: 12px 16px; border-top: 1px solid #e0e0e0; }
      .accordion-icerik.acik { display: block; }
      .yetenek-kart { padding: 10px; background: #fef7e0; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid #f9ab00; }
      @media print {
        .topbar, .sekme-bar, .btn, .no-print { display: none !important; }
        body { background: white; }
        .icerik { padding: 0; max-width: 100%; }
        .kart { box-shadow: none; border: 1px solid #ddd; margin-bottom: 10px; break-inside: avoid; }
        .print-baslik { display: block !important; }
        .accordion-icerik { display: block !important; }
        .sekme-icerik { display: block !important; }
      }
      .print-baslik { display: none; }
      @media (max-width: 768px) { .icerik { padding: 12px; } }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>👤 Öğrenci Profil Sistemi</h1>
      <div class="topbar-sag">
        <a href="/portal.html" class="btn btn-beyaz">← Ana Sayfa</a>
      </div>
    </div>
    <div class="icerik">
      <div id="yukleniyor" class="yukleniyor">⏳ Yükleniyor...</div>
      <div id="anaIcerik" style="display:none"></div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import {
        getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc,
        getDocs, collection, query, where, serverTimestamp, writeBatch,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAHTCiicd4b94rG1-jN0STRbwcrLmkYudo",
        authDomain: "okul-yoklama-sistemi-8081f.firebaseapp.com",
        projectId: "okul-yoklama-sistemi-8081f",
        storageBucket: "okul-yoklama-sistemi-8081f.firebasestorage.app",
        messagingSenderId: "38230047763",
        appId: "1:38230047763:web:dfab058df8928b66be13e6",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const VARSAYILAN_REHBER_SORULAR = [
        "Boş bir günün olsa sabah kalktıktan gece yatana kadar neler yapardın?",
        "Sence seni en iyi tanıyan biri seni nasıl anlatırdı?",
        "Okulda seni en çok mutlu eden şey nedir, en çok zorlayan şey nedir?",
        "Bir öğretmende mutlaka olmasını istediğin özellik nedir?",
        "Hayatında değiştirmek istediğin bir şey olsa neyi değiştirirdin?",
        "Kendinle ilgili en güçlü gördüğün özellik ne?",
        "Bir konuda yardım istemekte zorlanır mısın? En çok hangi konularda yardım almak istersin?",
        "Seni gerçekten çok sinirlendiren veya üzen şeyler genelde neler olur?",
        "Şu anda hayatındaki en önemli hedef nedir?",
        "İnsanların senin hakkında yanlış düşündüğünü hissettiğin bir şey var mı?",
      ];

      const YETENEK_KATEGORILER = ["Spor", "Müzik", "Sanat", "Sahne Sanatları", "Akademik Üstünlük", "Teknoloji", "Liderlik", "Diğer"];

      let sorular = { rehber_sorular: [...VARSAYILAN_REHBER_SORULAR], brans_sorular: [] };
      let aktifRol = null;
      let aktifOgretmenId = null;
      let aktifOgretmenAd = null;
      let aktifOgretmenBrans = null;
      let aktifOgretmenRehber = false;
      let tumOgretmenler = [];
      let tumSiniflar = [];
      let tumOgrenciler = [];
      let _sinifOgrenciler = [];

      async function soruYukle() {
        try {
          const d = await getDoc(doc(db, "profil_ayarlar", "sorular"));
          if (d.exists()) {
            const data = d.data();
            sorular.rehber_sorular = data.rehber_sorular?.length ? data.rehber_sorular : [...VARSAYILAN_REHBER_SORULAR];
            sorular.brans_sorular = data.brans_sorular || [];
          }
        } catch (e) {}
      }

      onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "/portal.html"; return; }
        const ud = await getDoc(doc(db, "users", user.uid));
        if (!ud.exists()) { window.location.href = "/portal.html"; return; }
        aktifRol = ud.data().rol;

        await Promise.all([ogretmenleriYukle(), siniflariYukle(), ogrencileriYukle(), soruYukle()]);

        if (aktifRol === "ogretmen") {
          const ogSnap = await getDocs(query(collection(db, "teachers"), where("uid", "==", user.uid)));
          if (!ogSnap.empty) {
            aktifOgretmenId = ogSnap.docs[0].id;
            const ogData = ogSnap.docs[0].data();
            aktifOgretmenAd = ogData.ad;
            aktifOgretmenBrans = ogData.brans;
            aktifOgretmenRehber = !!(ogData.rehberSube || ogData.sinifSeviye);
          }
        }

        document.getElementById("yukleniyor").style.display = "none";
        document.getElementById("anaIcerik").style.display = "block";

        if (aktifRol === "admin" || aktifRol === "mudur_yardimcisi") {
          adminSayfasi();
        } else {
          ogretmenSayfasi();
        }
      });

      async function ogretmenleriYukle() {
        const snap = await getDocs(collection(db, "teachers"));
        tumOgretmenler = [];
        snap.forEach((d) => tumOgretmenler.push({ id: d.id, ...d.data() }));
        tumOgretmenler.sort((a, b) => (a.ad || "").localeCompare(b.ad || "", "tr"));
      }

      async function siniflariYukle() {
        const snap = await getDocs(collection(db, "classes"));
        tumSiniflar = [];
        snap.forEach((d) => tumSiniflar.push({ id: d.id, ...d.data() }));
        tumSiniflar.sort((a, b) => (a.class_name || "").localeCompare(b.class_name || "", "tr"));
      }

      async function ogrencileriYukle() {
        const snap = await getDocs(collection(db, "students"));
        tumOgrenciler = [];
        snap.forEach((d) => {
          const data = { id: d.id, ...d.data() };
          if (data.class_id) {
            const sinif = tumSiniflar.find((s) => s.class_name === data.class_id);
            if (sinif) data.sinif_id_gercek = sinif.id;
          }
          tumOgrenciler.push(data);
        });
        tumOgrenciler.sort((a, b) => (a.name || "").localeCompare(b.name || "", "tr"));
      }

      // ── ÖĞRETMEN SAYFASI ──
      function ogretmenSayfasi() {
        document.getElementById("anaIcerik").innerHTML = `
          <div class="sekme-bar">
            <button class="sekme-btn aktif" onclick="ogretmenSekme('veriGir', this)">📝 Veri Gir</button>
            <button class="sekme-btn" onclick="ogretmenSekme('yetenek', this)">⭐ Yetenek Ekle</button>
            <button class="sekme-btn" onclick="ogretmenSekme('girdiklerim', this)">📋 Girdiklerim</button>
          </div>
          <div class="sekme-icerik aktif" id="osekme-veriGir"></div>
          <div class="sekme-icerik" id="osekme-yetenek"></div>
          <div class="sekme-icerik" id="osekme-girdiklerim"></div>`;
        ogretmenVeriGirGoster();
      }

      window.ogretmenSekme = (id, el) => {
        document.querySelectorAll(".sekme-btn").forEach((b) => b.classList.remove("aktif"));
        document.querySelectorAll(".sekme-icerik").forEach((s) => s.classList.remove("aktif"));
        el.classList.add("aktif");
        document.getElementById("osekme-" + id).classList.add("aktif");
        if (id === "veriGir") ogretmenVeriGirGoster();
        else if (id === "yetenek") ogretmenYetenekGoster();
        else if (id === "girdiklerim") ogretmenGirdikleriniGoster();
      };

      function ogretmenVeriGirGoster() {
        const c = document.getElementById("osekme-veriGir");
        const aktifSorular = aktifOgretmenRehber ? sorular.rehber_sorular : sorular.brans_sorular;

        if (!aktifSorular.length && !aktifOgretmenRehber) {
          c.innerHTML = `<div class="kart"><div class="bos-mesaj">Branş soruları henüz admin tarafından eklenmemiş.</div></div>`;
          return;
        }

        c.innerHTML = `<div class="kart">
          <div class="kart-baslik">Sınıf Seç
            <span class="rozet ${aktifOgretmenRehber ? "rozet-mor" : "rozet-mavi"}">${aktifOgretmenRehber ? "🎓 Rehber Öğretmen" : "📚 Branş Öğretmeni"}</span>
          </div>
          <div class="form-group">
            <select id="sinifSec" onchange="sinifSecildi(this.value)">
              <option value="">-- Sınıf Seçin --</option>
              ${tumSiniflar.map((s) => `<option value="${s.id}">${s.class_name}</option>`).join("")}
            </select>
          </div>
        </div>
        <div id="ogrenciListesiWrap"></div>`;
      }

      window.sinifSecildi = async (sinifId) => {
        if (!sinifId) return;
        const wrap = document.getElementById("ogrenciListesiWrap");
        wrap.innerHTML = '<div class="yukleniyor">Yükleniyor...</div>';

        _sinifOgrenciler = tumOgrenciler.filter(
          (o) => o.sinif_id_gercek === sinifId || o.class_id === sinifId,
        );

        const veriSnap = await getDocs(
          query(
            collection(db, "ogrenci_veriler"),
            where("ogretmen_id", "==", aktifOgretmenId),
            where("sinif_id", "==", sinifId),
          ),
        );
        const veriOgrenciler = new Set();
        veriSnap.forEach((d) => veriOgrenciler.add(d.data().ogrenci_id));

        if (!_sinifOgrenciler.length) {
          wrap.innerHTML = '<div class="kart"><div class="bos-mesaj">Bu sınıfta öğrenci bulunamadı.</div></div>';
          return;
        }

        let html = `<div class="kart">
          <div class="kart-baslik">Öğrenci Listesi
            <span class="rozet rozet-mavi">${veriOgrenciler.size}/${_sinifOgrenciler.length} veri girildi</span>
          </div>`;

        _sinifOgrenciler.forEach((o, idx) => {
          const veriVar = veriOgrenciler.has(o.id);
          html += `<div class="ogrenci-kart ${veriVar ? "veri-var" : ""}" onclick="ogrenciTikla(${idx}, '${sinifId}')">
            <div>
              <div style="font-size:14px;font-weight:700;color:#333;">${o.name || o.ad || ""}</div>
              <div style="font-size:12px;color:#888;">${o.student_number || o.numara || ""}</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              ${veriVar ? '<span class="rozet rozet-yesil">✓ Veri Girildi</span>' : '<span class="rozet rozet-kirmizi">Veri Bekleniyor</span>'}
              <span style="color:#1a73e8;font-size:18px;">›</span>
            </div>
          </div>`;
        });
        html += "</div>";
        wrap.innerHTML = html;
      };

      window.ogrenciTikla = (idx, sinifId) => {
        const o = _sinifOgrenciler[idx];
        if (o) ogrenciVeriFormu(o.id, o.name || o.ad || "", sinifId);
      };

      window.ogrenciVeriFormu = async (ogrenciId, ogrenciAd, sinifId) => {
        const c = document.getElementById("osekme-veriGir");
        const aktifSorular = aktifOgretmenRehber ? sorular.rehber_sorular : sorular.brans_sorular;
        const soruTip = aktifOgretmenRehber ? "rehber" : "brans";

        const mevcutSnap = await getDocs(
          query(
            collection(db, "ogrenci_veriler"),
            where("ogretmen_id", "==", aktifOgretmenId),
            where("ogrenci_id", "==", ogrenciId),
          ),
        );
        const mevcutYanitlar = {};
        mevcutSnap.forEach((d) => {
          const v = d.data();
          if (v.soru_index !== undefined) mevcutYanitlar[v.soru_index] = v.yanit || "";
        });

        let soruHtml = "";
        aktifSorular.forEach((soru, idx) => {
          const mevcut = mevcutYanitlar[idx] || "";
          soruHtml += `<div class="soru-kart">
            <div class="soru-metin">${idx + 1}. ${soru}</div>
            <textarea id="yanit_${idx}" placeholder="Yanıtınızı buraya yazın..." style="width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:inherit;min-height:80px;outline:none;resize:vertical;">${mevcut}</textarea>
          </div>`;
        });

        c.innerHTML = `
          <button class="btn btn-gri btn-sm no-print" onclick="ogretmenVeriGirGoster()" style="margin-bottom:16px;">← Geri</button>
          <div class="kart">
            <div class="kart-baslik">
              ${ogrenciAd} — Veri Girişi
              <span class="rozet ${aktifOgretmenRehber ? "rozet-mor" : "rozet-mavi"}">${aktifOgretmenRehber ? "Rehber Öğretmen" : "Branş Öğretmeni"}</span>
            </div>
            <p style="font-size:13px;color:#888;margin-bottom:20px;">Her soruyu öğrenciyle görüşerek ya da gözlemlerinize dayanarak yanıtlayın.</p>
            ${soruHtml}
            <div class="mesaj" id="veriMesaj"></div>
            <div style="display:flex;gap:10px;margin-top:10px;">
              <button class="btn btn-yesil" onclick="veriKaydet('${ogrenciId}', '${sinifId}', '${soruTip}')">💾 Kaydet</button>
              <button class="btn btn-gri" onclick="ogretmenVeriGirGoster()">İptal</button>
            </div>
          </div>`;

        window._ogrenciAd = ogrenciAd;
      };

      window.veriKaydet = async (ogrenciId, sinifId, soruTip) => {
        const aktifSorular = soruTip === "rehber" ? sorular.rehber_sorular : sorular.brans_sorular;
        const ogrenciAd = window._ogrenciAd || "";
        const yanitlar = [];

        for (let i = 0; i < aktifSorular.length; i++) {
          const yanit = document.getElementById("yanit_" + i)?.value?.trim() || "";
          yanitlar.push({ soru_index: i, soru: aktifSorular[i], yanit, tip: soruTip });
        }

        const bosVar = yanitlar.some((y) => !y.yanit);
        if (bosVar) {
          const devam = confirm("Bazı sorular yanıtsız. Yine de kaydetmek istiyor musunuz?");
          if (!devam) return;
        }

        mesajGoster("veriMesaj", "Kaydediliyor...", "bilgi");

        const eskiSnap = await getDocs(
          query(
            collection(db, "ogrenci_veriler"),
            where("ogretmen_id", "==", aktifOgretmenId),
            where("ogrenci_id", "==", ogrenciId),
          ),
        );
        const batch = writeBatch(db);
        eskiSnap.docs.forEach((d) => batch.delete(d.ref));
        await batch.commit();

        await Promise.all(
          yanitlar
            .filter((y) => y.yanit)
            .map((y) =>
              addDoc(collection(db, "ogrenci_veriler"), {
                ogrenci_id: ogrenciId,
                ogrenci_ad: ogrenciAd,
                sinif_id: sinifId,
                ogretmen_id: aktifOgretmenId,
                ogretmen_ad: aktifOgretmenAd,
                ogretmen_brans: aktifOgretmenBrans,
                soru_index: y.soru_index,
                soru: y.soru,
                yanit: y.yanit,
                tip: y.tip,
                tarih: serverTimestamp(),
              }),
            ),
        );

        mesajGoster("veriMesaj", "Veriler kaydedildi!", "basari");
        setTimeout(() => ogretmenVeriGirGoster(), 1500);
      };

      // YETENEK EKLEME
      function ogretmenYetenekGoster() {
        const c = document.getElementById("osekme-yetenek");
        c.innerHTML = `<div class="kart">
          <div class="kart-baslik">Yetenek Ekle</div>
          <p style="font-size:13px;color:#888;margin-bottom:16px;">Yetenek gördüğünüz öğrenciyi seçin, kategori ve açıklama girin.</p>
          <div class="form-group">
            <label>Sınıf</label>

      async function adminIstatistikGoster() {
        const c = document.getElementById("asekme-istatistik");
        c.innerHTML = '<div class="yukleniyor">Yükleniyor...</div>';

        const veriSnap = await getDocs(collection(db, "ogrenci_veriler"));
        const veriOgrenciler = new Set();
        const veriSiniflar = new Map();
        veriSnap.forEach((d) => {
          const v = d.data();
          veriOgrenciler.add(v.ogrenci_id);
          if (!veriSiniflar.has(v.sinif_id)) veriSiniflar.set(v.sinif_id, new Set());
          veriSiniflar.get(v.sinif_id).add(v.ogrenci_id);
        });

        const toplamOgrenci = tumOgrenciler.length;
        const veriGirilenOgrenci = veriOgrenciler.size;
        const yuzde = toplamOgrenci > 0 ? Math.round((veriGirilenOgrenci / toplamOgrenci) * 100) : 0;

        let html = `<div class="istat-grid">
          <div class="istat-kart"><div class="istat-sayi" style="color:#1a73e8;">${toplamOgrenci}</div><div class="istat-etiket">Toplam Öğrenci</div></div>
          <div class="istat-kart"><div class="istat-sayi" style="color:#34a853;">${veriGirilenOgrenci}</div><div class="istat-etiket">Profil Oluşturulan</div></div>
          <div class="istat-kart"><div class="istat-sayi" style="color:#f9ab00;">%${yuzde}</div><div class="istat-etiket">Tamamlanma</div></div>
          <div class="istat-kart"><div class="istat-sayi" style="color:#ea4335;">${toplamOgrenci - veriGirilenOgrenci}</div><div class="istat-etiket">Bekleyen</div></div>
        </div>`;

        html += '<div class="kart"><div class="kart-baslik">Sınıf Bazında Durum</div>';
        tumSiniflar.forEach((sinif) => {
          const sinifOgrenciler = tumOgrenciler.filter((o) => o.sinif_id_gercek === sinif.id);
          const sinifVeri = veriSiniflar.get(sinif.id)?.size || 0;
          const sinifYuzde = sinifOgrenciler.length > 0 ? Math.round((sinifVeri / sinifOgrenciler.length) * 100) : 0;
          const renk = sinifYuzde >= 80 ? "#34a853" : sinifYuzde >= 50 ? "#f9ab00" : "#ea4335";
          html += `<div class="ilerleme-wrap">
            <div class="ilerleme-label"><span>${sinif.class_name}</span><span>${sinifVeri}/${sinifOgrenciler.length} (%${sinifYuzde})</span></div>
            <div class="ilerleme-bar"><div class="ilerleme-dolgu" style="width:${sinifYuzde}%;background:${renk};"></div></div>
          </div>`;
        });
        html += "</div>";
        c.innerHTML = html;
      }

                </div>`;
              });

        html += "</div>";

        // Branş değerlendirmeleri
        html += '<div class="kart"><div class="kart-baslik">📚 Branş Öğretmenleri Değerlendirmeleri</div>';
        if (!bransVeriler.length) {
          html += '<div class="bos-mesaj">Branş öğretmeni henüz veri girmemiş.</div>';
        } else {
          bransGruplari.forEach((ogr) => {
            html += `<div class="accordion-item">
              <div class="accordion-baslik" onclick="this.nextElementSibling.classList.toggle('acik')">

                html += `<div style="padding:10px;background:#f8f9fa;border-radius:8px;margin-bottom:8px;border-left:3px solid #1a73e8;">
                  <div style="font-size:12px;font-weight:700;color:#1a73e8;margin-bottom:4px;">${v.soru || ""}</div>
                  <div style="font-size:13px;color:#333;line-height:1.6;">${v.yanit || ""}</div>

        c.innerHTML = html;

              </div>`
            ).join("")
          : `<div id="brans-bos" style="color:#888;font-size:13px;margin-bottom:12px;">Henüz soru eklenmemiş.</div>`;

        c.innerHTML = `
          <div class="kart">
            <div class="kart-baslik">🎓 Şube Rehber Öğretmeni Soruları</div>
            <p style="font-size:13px;color:#888;margin-bottom:16px;">Rehber öğretmenin öğrenciyle ilgili dolduracağı açık uçlu sorular.</p>
            <div id="rehber-sorular-wrap">${rehberHtml}</div>
            <button class="btn btn-mavi btn-sm no-print" onclick="soruEkle('rehber')" style="margin-top:4px;margin-bottom:16px;">+ Soru Ekle</button>
          </div>
          <div class="kart">
            <div class="kart-baslik">📚 Branş Öğretmeni Soruları</div>
            <p style="font-size:13px;color:#888;margin-bottom:16px;">Branş öğretmenlerinin dolduracağı sorular. Admin tarafından düzenlenebilir.</p>
            <div id="brans-sorular-wrap">${bransHtml}</div>
            <button class="btn btn-mavi btn-sm no-print" onclick="soruEkle('brans')" style="margin-top:4px;margin-bottom:16px;">+ Soru Ekle</button>
          </div>
          <button class="btn btn-yesil" onclick="soruKaydet()">💾 Soruları Kaydet</button>
          <div class="mesaj" id="ayarMesaj"></div>`;
      }

      window.soruEkle = (tip) => {
        const wrap = document.getElementById(tip + "-sorular-wrap");
        const bosEl = document.getElementById(tip + "-bos");
        if (bosEl) bosEl.remove();
        const idx = wrap.querySelectorAll(".soru-satir").length;
        const div = document.createElement("div");
        div.className = "soru-satir";
        div.id = `${tip}-satir-${idx}`;
        div.innerHTML = `<input type="text" id="${tip}-soru-${idx}" placeholder="Soru ${idx + 1}">
          <button class="btn btn-kirmizi btn-sm" onclick="soruSil('${tip}', ${idx})">Sil</button>`;
        wrap.appendChild(div);
      };

      window.soruSil = (tip, idx) => {
        const el = document.getElementById(`${tip}-satir-${idx}`);
        if (el) el.remove();
      };

      window.soruKaydet = async () => {
        const rehberSorular = Array.from(
          document.querySelectorAll("#rehber-sorular-wrap input[type=text]")
        ).map((i) => i.value.trim()).filter(Boolean);

        const bransSorular = Array.from(
          document.querySelectorAll("#brans-sorular-wrap input[type=text]")
        ).map((i) => i.value.trim()).filter(Boolean);

        if (!rehberSorular.length) {
          mesajGoster("ayarMesaj", "Rehber soruları boş bırakılamaz.", "hata");
          return;
        }

        mesajGoster("ayarMesaj", "Kaydediliyor...", "bilgi");
        await setDoc(doc(db, "profil_ayarlar", "sorular"), {
          rehber_sorular: rehberSorular,
          brans_sorular: bransSorular,
          guncelleme: serverTimestamp(),
        });
        sorular.rehber_sorular = rehberSorular;
        sorular.brans_sorular = bransSorular;
        mesajGoster("ayarMesaj", "Sorular başarıyla kaydedildi!", "basari");
      };

      function mesajGoster(id, metin, tip) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = metin;
        el.className = "mesaj mesaj-" + tip;
        if (tip !== "bilgi") setTimeout(() => (el.className = "mesaj"), 4000);
      }
    </script>
  </body>
</html>
