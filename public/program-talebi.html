<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ders Programı Talep Sistemi</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f4f8;
        color: #1a1d2e;
      }
      .topbar {
        background: #0d47a1;
        color: white;
        padding: 13px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .topbar h1 {
        font-size: 16px;
        font-weight: 700;
      }
      .topbar-sag {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.15s;
      }
      .btn-beyaz {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .btn-beyaz:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .btn-mavi {
        background: #1a73e8;
        color: white;
      }
      .btn-mavi:hover {
        background: #1557b0;
      }
      .btn-yesil {
        background: #34a853;
        color: white;
      }
      .btn-yesil:hover {
        background: #2d8f47;
      }
      .btn-kirmizi {
        background: #ea4335;
        color: white;
      }
      .btn-kirmizi:hover {
        background: #c5221f;
      }
      .btn-gri {
        background: #666;
        color: white;
      }
      .btn-turuncu {
        background: #f9ab00;
        color: white;
      }
      .btn-sm {
        padding: 5px 12px;
        font-size: 12px;
      }
      .icerik {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .kart {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        margin-bottom: 16px;
      }
      .kart-baslik {
        font-size: 15px;
        font-weight: 700;
        color: #333;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sekme-bar {
        display: flex;
        gap: 4px;
        margin-bottom: 20px;
        background: #f0f4f8;
        border-radius: 10px;
        padding: 4px;
        width: fit-content;
        flex-wrap: wrap;
      }
      .sekme-btn {
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: #6b7280;
        border: none;
        background: none;
        font-family: inherit;
        transition: all 0.15s;
      }
      .sekme-btn.aktif {
        background: white;
        color: #1a73e8;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }
      .sekme-icerik {
        display: none;
      }
      .sekme-icerik.aktif {
        display: block;
      }
      .rozet {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
      }
      .rozet-yesil {
        background: #e6f4ea;
        color: #1e7e34;
      }
      .rozet-kirmizi {
        background: #fce8e6;
        color: #c5221f;
      }
      .rozet-mavi {
        background: #e8f0fe;
        color: #1a73e8;
      }
      .rozet-sari {
        background: #fef7e0;
        color: #b06000;
      }
      .rozet-gri {
        background: #f1f3f4;
        color: #555;
      }
      .mesaj {
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        margin-top: 10px;
        display: none;
      }
      .mesaj-basari {
        background: #e6f4ea;
        color: #1e7e34;
      }
      .mesaj-hata {
        background: #fce8e6;
        color: #c5221f;
      }
      .mesaj-bilgi {
        background: #e8f0fe;
        color: #1a73e8;
      }
      .yukleniyor {
        text-align: center;
        padding: 60px;
        color: #666;
      }
      .form-group {
        margin-bottom: 14px;
      }
      .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #6b7280;
        margin-bottom: 5px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: #1a73e8;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        background: #f8f9fa;
        padding: 10px 14px;
        text-align: left;
        font-size: 12px;
        font-weight: 700;
        color: #6b7280;
        border-bottom: 2px solid #e0e0e0;
      }
      td {
        padding: 10px 14px;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px;
      }
      tr:last-child td {
        border-bottom: none;
      }

      /* MATRİS */
      .matris-wrap {
        overflow-x: auto;
      }
      .matris {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
      }
      .matris th {
        background: #0d47a1;
        color: white;
        padding: 8px 6px;
        text-align: center;
        font-size: 11px;
      }
      .matris th:first-child {
        min-width: 90px;
        text-align: left;
        padding-left: 10px;
      }
      .matris td {
        border: 1px solid #e0e0e0;
        padding: 0;
        text-align: center;
        height: 44px;
        cursor: pointer;
        transition: background 0.1s;
      }
      .matris td:first-child {
        background: #f8f9fa;
        font-weight: 700;
        font-size: 11px;
        color: #555;
        cursor: default;
        padding: 0 10px;
        text-align: left;
      }
      .hucre-bos {
        background: white;
      }
      .hucre-bos:hover {
        background: #fce8e6;
      }
      .hucre-x {
        background: #fce8e6;
      }
      .hucre-x:hover {
        background: #f5b7b1;
      }
      .hucre-x-ic {
        color: #c5221f;
        font-weight: 800;
        font-size: 16px;
      }

      /* ISI HARİTASI RENKLERİ */
      .isi-0 {
        background: #e8f5e9;
      }
      .isi-1 {
        background: #c8e6c9;
      }
      .isi-2 {
        background: #fff9c4;
      }
      .isi-3 {
        background: #ffe0b2;
      }
      .isi-4 {
        background: #ffccbc;
      }
      .isi-5 {
        background: #ffcdd2;
      }
      .isi-6 {
        background: #ef9a9a;
      }

      .uyum-bar {
        height: 16px;
        border-radius: 8px;
        background: #e0e0e0;
        overflow: hidden;
        margin-top: 6px;
      }
      .uyum-dolgu {
        height: 100%;
        border-radius: 8px;
        transition: width 0.3s;
      }

      .acmaz-uyari {
        background: #fce8e6;
        border: 1px solid #f5c6c6;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 13px;
        color: #c5221f;
        margin-bottom: 12px;
      }
      .acmaz-uyari strong {
        display: block;
        margin-bottom: 4px;
      }

      .isi-legend {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 11px;
        margin-bottom: 12px;
      }
      .isi-legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .isi-legend-renk {
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }

      @media (max-width: 768px) {
        .icerik {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>📐 Ders Programı Talep Sistemi</h1>
      <div class="topbar-sag">
        <span id="donemRozet" class="rozet rozet-kirmizi">Talep Kapalı</span>
        <a href="/portal.html" class="btn btn-beyaz">Ana Sayfa</a>
      </div>
    </div>

    <div class="icerik">
      <div id="yukleniyor" class="yukleniyor">Yükleniyor...</div>
      <div id="anaIcerik" style="display: none"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        getDocs,
        addDoc,
        deleteDoc,
        collection,
        query,
        where,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAHTCiicd4b94rG1-jN0STRbwcrLmkYudo",
        authDomain: "okul-yoklama-sistemi-8081f.firebaseapp.com",
        projectId: "okul-yoklama-sistemi-8081f",
        storageBucket: "okul-yoklama-sistemi-8081f.firebasestorage.app",
        messagingSenderId: "38230047763",
        appId: "1:38230047763:web:dfab058df8928b66be13e6",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const GUNLER = ["Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma"];
      const DERSLER = [1, 2, 3, 4, 5, 6, 7, 8];

      let aktifKullanici = null;
      let aktifRol = null;
      let aktifOgretmenId = null;
      let ayarlar = { donem_acik: false };
      let tumTanimlar = []; // ogretmen-sube-ders tanimlari
      let subeToplam = {}; // sube -> haftalik_toplam
      let tumMatrisler = {}; // ogretmen_id -> matris
      let benimMatris = {}; // "Pzt-1": true/false

      // Matris key: "Pzt-1", "Sal-3" vs
      function matrisKey(gi, di) {
        return GUNLER[gi] + "-" + DERSLER[di];
      }

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "/portal.html";
          return;
        }
        const ud = await getDoc(doc(db, "users", user.uid));
        if (!ud.exists()) {
          window.location.href = "/portal.html";
          return;
        }
        aktifKullanici = ud.data();
        aktifRol = aktifKullanici.rol;

        if (aktifRol === "ogretmen") {
          const ogSnap = await getDocs(
            query(collection(db, "teachers"), where("uid", "==", user.uid)),
          );
          if (!ogSnap.empty) aktifOgretmenId = ogSnap.docs[0].id;
        }

        await ayarlariYukle();
        await tanimlariYukle();
        await tumMatrisleriYukle();

        document.getElementById("yukleniyor").style.display = "none";
        document.getElementById("anaIcerik").style.display = "block";

        if (aktifRol === "admin" || aktifRol === "mudur_yardimcisi") {
          adminSayfasi();
        } else {
          ogretmenSayfasi();
        }
      });

      async function ayarlariYukle() {
        const snap = await getDoc(doc(db, "program_talep_ayarlar", "genel"));
        if (snap.exists()) ayarlar = snap.data();
        const r = document.getElementById("donemRozet");
        if (ayarlar.donem_acik) {
          r.textContent = "Talep Dönemi Açık";
          r.className = "rozet rozet-yesil";
        } else {
          r.textContent = "Talep Kapalı";
          r.className = "rozet rozet-kirmizi";
        }
      }

      async function tanimlariYukle() {
        const snap = await getDocs(collection(db, "program_talep_tanimlar"));
        tumTanimlar = [];
        snap.forEach((d) => tumTanimlar.push({ id: d.id, ...d.data() }));

        const sSnap = await getDocs(
          collection(db, "program_talep_sube_toplam"),
        );
        subeToplam = {};
        sSnap.forEach((d) => {
          subeToplam[d.data().sube] = d.data().haftalik_toplam;
        });
      }

      async function tumMatrisleriYukle() {
        const snap = await getDocs(collection(db, "program_talep_matris"));
        tumMatrisler = {};
        snap.forEach((d) => {
          tumMatrisler[d.id] = d.data().matris || {};
        });
      }

      // ── BÖLÜNME ANALİZİ ──
      function bolunmedenParcaSayisi(bolunme) {
        if (!bolunme) return 1;
        return bolunme.toString().split("+").length;
      }

      // Bir öğretmenin bir şubedeki dersi için açmaz var mı?
      function acmazKontrol(ogretmenId, sube, bolunme) {
        const parcaSayisi = bolunmedenParcaSayisi(bolunme);
        const matris = tumMatrisler[ogretmenId] || benimMatris;
        // Müsait gün sayısı (X koymadığı günler)
        let musaitGunler = 0;
        for (let gi = 0; gi < 5; gi++) {
          // Bu günde en az 1 müsait saat var mı?
          let gunMusait = false;
          for (let di = 0; di < 8; di++) {
            if (!matris[matrisKey(gi, di)]) {
              gunMusait = true;
              break;
            }
          }
          if (gunMusait) musaitGunler++;
        }
        return musaitGunler < parcaSayisi;
      }

      // Şube bazlı açmaz analizi
      function subeAcmazAnaliz(sube) {
        const subeTanimlar = tumTanimlar.filter((t) => t.sube === sube);
        const acmazlar = [];
        for (let gi = 0; gi < 5; gi++) {
          for (let di = 0; di < 8; di++) {
            const key = matrisKey(gi, di);
            // Bu saatte kaç öğretmen X koymuş
            const bosOgretmenler = subeTanimlar.filter((t) => {
              const m = tumMatrisler[t.ogretmen_id] || {};
              return !m[key];
            });
            // Toplam öğretmen sayısı
            const toplamOgr = subeTanimlar.length;
            if (toplamOgr > 0 && bosOgretmenler.length === 0) {
              acmazlar.push({ gun: GUNLER[gi], saat: DERSLER[di] });
            }
          }
        }
        return acmazlar;
      }

      // Uyum yüzdesi hesapla
      function uyumYuzdesi(ogretmenId) {
        const matris =
          ogretmenId === aktifOgretmenId
            ? benimMatris
            : tumMatrisler[ogretmenId] || {};
        let kirmizi = 0,
          toplam = 0;
        for (let gi = 0; gi < 5; gi++) {
          for (let di = 0; di < 8; di++) {
            if (matris[matrisKey(gi, di)]) {
              toplam++;
              // Bu hücrede yoğunluk var mı?
              const yogunluk = isiYogunluk(gi, di);
              if (yogunluk >= 3) kirmizi++;
            }
          }
        }
        if (toplam === 0) return 100;
        return Math.round((1 - kirmizi / toplam) * 100);
      }

      // Isı yoğunluğu: o gün/saatte kaç öğretmen X koymuş
      function isiYogunluk(gi, di) {
        const key = matrisKey(gi, di);
        let sayi = 0;
        Object.values(tumMatrisler).forEach((m) => {
          if (m[key]) sayi++;
        });
        // Kendi matrisimizi de say
        if (benimMatris[key]) sayi++;
        return sayi;
      }

      // ── ÖĞRETMEN SAYFASI ──
      function ogretmenSayfasi() {
        if (!ayarlar.donem_acik) {
          document.getElementById("anaIcerik").innerHTML = `
      <div class="kart" style="text-align:center;padding:40px;">
        <div style="font-size:40px;margin-bottom:16px;">🔒</div>
        <div style="font-size:18px;font-weight:700;color:#333;margin-bottom:8px;">Talep Dönemi Kapalı</div>
        <div style="font-size:14px;color:#888;">Ders programı talep dönemi henüz açılmadı.</div>
      </div>`;
          return;
        }

        // Kendi matrisimi yükle
        benimMatris = tumMatrisler[aktifOgretmenId]
          ? { ...tumMatrisler[aktifOgretmenId] }
          : {};

        // Kendi derslerimi bul
        const benimDerslerim = tumTanimlar.filter(
          (t) => t.ogretmen_id === aktifOgretmenId,
        );
        const toplamSaat = benimDerslerim.reduce(
          (s, t) => s + (t.haftalik_saat || 0),
          0,
        );

        document.getElementById("anaIcerik").innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start;">
      <div>
        <div class="kart">
          <div class="kart-baslik">
            Boş İstediğiniz Gün/Saatleri İşaretleyin
            <div style="display:flex;gap:8px;align-items:center;">
              <span id="uyumRozet" class="rozet rozet-mavi">—</span>
              <button class="btn btn-yesil btn-sm" onclick="matrisKaydet()">💾 Kaydet</button>
              <button class="btn btn-gri btn-sm" onclick="matrisiSifirla()">Sıfırla</button>
            </div>
          </div>
          <p style="font-size:12px;color:#888;margin-bottom:12px;">X işaretlediğiniz gün ve saatler boş talep ettiğiniz zamanlardır. Kırmızı hücreler yoğun talep olan saatlerdir — bu saatlere X koymaktan kaçının.</p>
          <div id="acmazUyari"></div>
          <div class="matris-wrap">
            <table class="matris" id="benimMatris"></table>
          </div>
          <div style="margin-top:12px;">
            <div style="font-size:12px;color:#888;margin-bottom:6px;">Uyum Skoru</div>
            <div class="uyum-bar"><div class="uyum-dolgu" id="uyumDolgu" style="width:0%;background:#34a853;"></div></div>
            <div style="font-size:13px;font-weight:700;color:#333;margin-top:4px;" id="uyumYazisi">Hesaplanıyor...</div>
          </div>
        </div>
      </div>
      <div>
        <div class="kart">
          <div class="kart-baslik" style="font-size:13px;">Ders Yükünüz</div>
          <div style="font-size:13px;color:#888;margin-bottom:12px;">Toplam: <strong style="color:#1a73e8;">${toplamSaat} saat</strong></div>
          ${
            benimDerslerim.length
              ? `
          <table><thead><tr><th>Şube</th><th>Ders</th><th>Saat</th><th>Bölünme</th></tr></thead><tbody>
          ${benimDerslerim.map((t) => `<tr><td>${t.sube}</td><td>${t.ders_adi}</td><td>${t.haftalik_saat}</td><td><span class="rozet rozet-mavi">${t.bolunme || "-"}</span></td></tr>`).join("")}
          </tbody></table>`
              : '<div style="color:#888;font-size:13px;">Ders tanımı bulunamadı.</div>'
          }
        </div>
        <div class="kart">
          <div class="kart-baslik" style="font-size:13px;">Isı Haritası Açıklaması</div>
          <div class="isi-legend">
            <div class="isi-legend-item"><div class="isi-legend-renk isi-0"></div><span>Boş</span></div>
            <div class="isi-legend-item"><div class="isi-legend-renk isi-2"></div><span>Az yoğun</span></div>
            <div class="isi-legend-item"><div class="isi-legend-renk isi-4"></div><span>Yoğun</span></div>
            <div class="isi-legend-item"><div class="isi-legend-renk isi-6"></div><span>Çok yoğun</span></div>
          </div>
          <div style="font-size:12px;color:#888;">Kırmızı alanlara X koymaktan kaçının. Yeşil alanlara yönelin.</div>
        </div>
      </div>
    </div>`;

        matrisGuncelle();
      }

      function matrisGuncelle() {
        const tablo = document.getElementById("benimMatris");
        if (!tablo) return;

        // Maksimum yoğunluk
        let maxY = 1;
        for (let gi = 0; gi < 5; gi++) {
          for (let di = 0; di < 8; di++) {
            const y = isiYogunluk(gi, di);
            if (y > maxY) maxY = y;
          }
        }

        let html = "<thead><tr><th>Gün \\ Ders</th>";
        DERSLER.forEach((d) => {
          html += "<th>" + d + ". Ders</th>";
        });
        html += "</tr></thead><tbody>";

        GUNLER.forEach((g, gi) => {
          html += "<tr><td>" + g + "</td>";
          DERSLER.forEach((d, di) => {
            const key = matrisKey(gi, di);
            const x = benimMatris[key];
            const yogunluk = isiYogunluk(gi, di);
            const isiSeviye = x
              ? ""
              : Math.min(6, Math.floor((yogunluk / maxY) * 6));
            const isiClass = x ? "hucre-x" : "hucre-bos isi-" + isiSeviye;
            html +=
              '<td class="' +
              isiClass +
              '" onclick="hucreTikla(' +
              gi +
              "," +
              di +
              ')">';
            if (x) html += '<div class="hucre-x-ic">✕</div>';
            html += "</td>";
          });
          html += "</tr>";
        });

        html += "</tbody>";
        tablo.innerHTML = html;

        // Uyum skoru
        const yuzde = uyumYuzdesi(aktifOgretmenId);
        const renk =
          yuzde >= 80 ? "#34a853" : yuzde >= 60 ? "#f9ab00" : "#ea4335";
        const dolgu = document.getElementById("uyumDolgu");
        if (dolgu) {
          dolgu.style.width = yuzde + "%";
          dolgu.style.background = renk;
        }
        const yazisi = document.getElementById("uyumYazisi");
        if (yazisi) yazisi.textContent = "Uyum Skoru: %" + yuzde;
        const rozet = document.getElementById("uyumRozet");
        if (rozet) {
          rozet.textContent = "%" + yuzde + " Uyumlu";
          rozet.className =
            "rozet " +
            (yuzde >= 80
              ? "rozet-yesil"
              : yuzde >= 60
                ? "rozet-sari"
                : "rozet-kirmizi");
        }

        // Açmaz uyarısı
        const benimSubeler = [
          ...new Set(
            tumTanimlar
              .filter((t) => t.ogretmen_id === aktifOgretmenId)
              .map((t) => t.sube),
          ),
        ];
        let acmazHtml = "";
        benimSubeler.forEach((sube) => {
          const t = tumTanimlar.find(
            (x) => x.ogretmen_id === aktifOgretmenId && x.sube === sube,
          );
          if (t && acmazKontrol(aktifOgretmenId, sube, t.bolunme)) {
            acmazHtml +=
              '<div class="acmaz-uyari"><strong>⚠️ ' +
              sube +
              " — " +
              t.ders_adi +
              "</strong>Bu ders için yeterli müsait gün kalmadı. Bazı X işaretlerini kaldırın.</div>";
          }
        });
        const uyariEl = document.getElementById("acmazUyari");
        if (uyariEl) uyariEl.innerHTML = acmazHtml;
      }

      window.hucreTikla = (gi, di) => {
        const key = matrisKey(gi, di);
        benimMatris[key] = !benimMatris[key];
        if (!benimMatris[key]) delete benimMatris[key];
        matrisGuncelle();
      };

      window.matrisKaydet = async () => {
        if (!aktifOgretmenId) return;
        await setDoc(doc(db, "program_talep_matris", aktifOgretmenId), {
          matris: benimMatris,
          ogretmen_id: aktifOgretmenId,
          son_guncelleme: serverTimestamp(),
        });
        tumMatrisler[aktifOgretmenId] = { ...benimMatris };
        mesajGoster("ogretmenMesaj", "Talebiniz kaydedildi.", "basari");
      };

      window.matrisiSifirla = () => {
        if (!confirm("Tüm X işaretlerini kaldırmak istiyor musunuz?")) return;
        benimMatris = {};
        matrisGuncelle();
      };

      // ── ADMİN SAYFASI ──
      function adminSayfasi() {
        document.getElementById("anaIcerik").innerHTML = `
    <div class="sekme-bar">
      <button class="sekme-btn aktif" onclick="adminSekme('tanim', this)">Tanımlar</button>
      <button class="sekme-btn" onclick="adminSekme('isi', this)">Isı Haritası</button>
      <button class="sekme-btn" onclick="adminSekme('acmaz', this)">Açmaz Analizi</button>
      <button class="sekme-btn" onclick="adminSekme('ayarlar', this)">Ayarlar</button>
    </div>
    <div class="sekme-icerik aktif" id="asekme-tanim"></div>
    <div class="sekme-icerik" id="asekme-isi"></div>
    <div class="sekme-icerik" id="asekme-acmaz"></div>
    <div class="sekme-icerik" id="asekme-ayarlar"></div>
  `;
        adminTanimGoster();
      }

      window.adminSekme = (id, el) => {
        document
          .querySelectorAll(".sekme-btn")
          .forEach((b) => b.classList.remove("aktif"));
        document
          .querySelectorAll(".sekme-icerik")
          .forEach((s) => s.classList.remove("aktif"));
        el.classList.add("aktif");
        document.getElementById("asekme-" + id).classList.add("aktif");
        if (id === "tanim") adminTanimGoster();
        else if (id === "isi") adminIsiGoster();
        else if (id === "acmaz") adminAcmazGoster();
        else if (id === "ayarlar") adminAyarlarGoster();
      };

      function adminTanimGoster() {
        const c = document.getElementById("asekme-tanim");
        const subeler = [...new Set(tumTanimlar.map((t) => t.sube))].sort();
        const ogretmenler = [
          ...new Set(tumTanimlar.map((t) => t.ogretmen_adi)),
        ].sort();

        c.innerHTML = `
    <div class="kart">
      <div class="kart-baslik">Excel ile Veri Yükle</div>
      <p style="font-size:13px;color:#888;margin-bottom:12px;">Şablonu indirin, doldurun, yükleyin. Mevcut tanımlar silinip yenisi eklenir.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a href="/program_talep_sablonu.xlsx" download><button class="btn btn-gri">📥 Şablon İndir</button></a>
        <label class="btn btn-mavi" style="cursor:pointer;">📂 Excel Yükle <input type="file" accept=".xlsx,.xls" style="display:none;" onchange="excelYukle(this)"></label>
      </div>
      <div class="mesaj" id="excelMesaj"></div>
    </div>
    <div class="kart">
      <div class="kart-baslik">
        Mevcut Tanımlar
        <span class="rozet rozet-mavi">${tumTanimlar.length} kayıt — ${subeler.length} şube — ${ogretmenler.length} öğretmen</span>
      </div>
      ${
        tumTanimlar.length
          ? `
      <table><thead><tr><th>Öğretmen</th><th>Şube</th><th>Ders</th><th>Saat</th><th>Bölünme</th></tr></thead><tbody>
      ${tumTanimlar.map((t) => `<tr><td>${t.ogretmen_adi}</td><td>${t.sube}</td><td>${t.ders_adi}</td><td>${t.haftalik_saat}</td><td><span class="rozet rozet-mavi">${t.bolunme || "-"}</span></td></tr>`).join("")}
      </tbody></table>`
          : '<div style="color:#888;padding:20px;text-align:center;">Henüz tanım yüklenmemiş.</div>'
      }
    </div>`;
      }

      window.excelYukle = async (input) => {
        const dosya = input.files[0];
        if (!dosya) return;
        mesajGoster("excelMesaj", "Yükleniyor...", "bilgi");
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const wb = XLSX.read(new Uint8Array(e.target.result), {
              type: "array",
            });
            // Sayfa 1: Ogretmen_Sube_Ders
            const ws1 = wb.Sheets[wb.SheetNames[0]];
            const rows1 = XLSX.utils
              .sheet_to_json(ws1, { header: 1 })
              .slice(3)
              .filter((r) => r[0]);
            // Sayfa 2: Sube_Toplam
            const ws2 = wb.Sheets[wb.SheetNames[1]];
            const rows2 = XLSX.utils
              .sheet_to_json(ws2, { header: 1 })
              .slice(3)
              .filter((r) => r[0]);

            // Mevcut tanimlari sil
            const eskiSnap = await getDocs(
              collection(db, "program_talep_tanimlar"),
            );
            await Promise.all(eskiSnap.docs.map((d) => deleteDoc(d.ref)));
            const eskiSSnap = await getDocs(
              collection(db, "program_talep_sube_toplam"),
            );
            await Promise.all(eskiSSnap.docs.map((d) => deleteDoc(d.ref)));

            // Yenilerini ekle
            const tanim_ekle = rows1.map((r) =>
              addDoc(collection(db, "program_talep_tanimlar"), {
                ogretmen_id: String(r[0]).trim(),
                ogretmen_adi: String(r[1]).trim(),
                sube: String(r[2]).trim(),
                ders_adi: String(r[3]).trim(),
                haftalik_saat: parseInt(r[4]) || 0,
                bolunme: String(r[5] || "").trim(),
              }),
            );
            const sube_ekle = rows2.map((r) =>
              addDoc(collection(db, "program_talep_sube_toplam"), {
                sube: String(r[0]).trim(),
                haftalik_toplam: parseInt(r[1]) || 0,
              }),
            );
            await Promise.all([...tanim_ekle, ...sube_ekle]);

            await tanimlariYukle();
            mesajGoster(
              "excelMesaj",
              rows1.length + " tanım yüklendi.",
              "basari",
            );
            adminTanimGoster();
          } catch (err) {
            mesajGoster("excelMesaj", "Hata: " + err.message, "hata");
          }
        };
        reader.readAsArrayBuffer(dosya);
      };

      function adminIsiGoster() {
        const c = document.getElementById("asekme-isi");

        // Tüm öğretmen sayısı
        const toplamOgr = Object.keys(tumMatrisler).length;
        let maxY = 1;
        for (let gi = 0; gi < 5; gi++) {
          for (let di = 0; di < 8; di++) {
            const y = isiYogunluk(gi, di);
            if (y > maxY) maxY = y;
          }
        }

        let html = `
    <div class="kart">
      <div class="kart-baslik">
        Genel Isı Haritası
        <div style="display:flex;gap:8px;">
          <span class="rozet rozet-mavi">${toplamOgr} öğretmen talep girdi</span>
          <button class="btn btn-gri btn-sm" onclick="window.print()">Yazdır</button>
        </div>
      </div>
      <div class="isi-legend">
        <div class="isi-legend-item"><div class="isi-legend-renk isi-0"></div><span>0 kişi boş</span></div>
        <div class="isi-legend-item"><div class="isi-legend-renk isi-2"></div><span>Az</span></div>
        <div class="isi-legend-item"><div class="isi-legend-renk isi-4"></div><span>Yoğun</span></div>
        <div class="isi-legend-item"><div class="isi-legend-renk isi-6"></div><span>Çok yoğun</span></div>
      </div>
      <div class="matris-wrap">
        <table class="matris"><thead><tr><th>Gün \\ Ders</th>`;

        DERSLER.forEach((d) => {
          html += "<th>" + d + ". Ders</th>";
        });
        html += "</tr></thead><tbody>";

        GUNLER.forEach((g, gi) => {
          html += "<tr><td>" + g + "</td>";
          DERSLER.forEach((d, di) => {
            const y = isiYogunluk(gi, di);
            const seviye =
              maxY > 0 ? Math.min(6, Math.floor((y / maxY) * 6)) : 0;
            html +=
              '<td class="isi-' +
              seviye +
              '" title="' +
              y +
              ' öğretmen boş istiyor" style="font-size:11px;font-weight:700;">' +
              (y || "") +
              "</td>";
          });
          html += "</tr>";
        });

        html += "</tbody></table></div></div>";

        // Öğretmen bazında uyum skorları
        html +=
          '<div class="kart"><div class="kart-baslik">Öğretmen Uyum Skorları</div><table><thead><tr><th>Öğretmen</th><th>Uyum Skoru</th><th>Durum</th></tr></thead><tbody>';
        const ogretmenler = [
          ...new Set(
            tumTanimlar
              .map((t) => ({ id: t.ogretmen_id, ad: t.ogretmen_adi }))
              .map(JSON.stringify),
          ),
        ].map(JSON.parse);
        ogretmenler.forEach((o) => {
          if (!tumMatrisler[o.id]) return;
          const yuzde = uyumYuzdesi(o.id);
          const renk =
            yuzde >= 80
              ? "rozet-yesil"
              : yuzde >= 60
                ? "rozet-sari"
                : "rozet-kirmizi";
          html +=
            "<tr><td>" +
            o.ad +
            '</td><td><div class="uyum-bar" style="width:150px;"><div class="uyum-dolgu" style="width:' +
            yuzde +
            "%;background:" +
            (yuzde >= 80 ? "#34a853" : yuzde >= 60 ? "#f9ab00" : "#ea4335") +
            ';"></div></div></td><td><span class="rozet ' +
            renk +
            '">%' +
            yuzde +
            "</span></td></tr>";
        });
        html += "</tbody></table></div>";
        c.innerHTML = html;
      }

      function adminAcmazGoster() {
        const c = document.getElementById("asekme-acmaz");
        const subeler = [...new Set(tumTanimlar.map((t) => t.sube))].sort();
        let html =
          '<div class="kart"><div class="kart-baslik">Şube Bazlı Açmaz Analizi</div>';

        if (!subeler.length) {
          html +=
            '<div style="color:#888;padding:20px;text-align:center;">Tanım yüklenmemiş.</div></div>';
          c.innerHTML = html;
          return;
        }

        let toplamAcmaz = 0;
        subeler.forEach((sube) => {
          const acmazlar = subeAcmazAnaliz(sube);
          toplamAcmaz += acmazlar.length;
          const durum =
            acmazlar.length === 0
              ? '<span class="rozet rozet-yesil">✓ Sorun Yok</span>'
              : '<span class="rozet rozet-kirmizi">⚠️ ' +
                acmazlar.length +
                " Açmaz</span>";
          html +=
            '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;">';
          html += "<strong>" + sube + "</strong>" + durum;
          html += "</div>";
          if (acmazlar.length) {
            html +=
              '<div style="font-size:12px;color:#c5221f;padding:4px 0 8px 16px;">';
            acmazlar.forEach((a) => {
              html +=
                "• " +
                a.gun +
                " " +
                a.saat +
                ". ders — tüm öğretmenler boş istiyor<br>";
            });
            html += "</div>";
          }
        });

        html += "</div>";
        if (toplamAcmaz === 0) {
          html =
            '<div class="kart" style="text-align:center;padding:30px;"><div style="font-size:32px;margin-bottom:12px;">✅</div><div style="font-size:16px;font-weight:700;color:#34a853;">Hiç açmaz tespit edilmedi!</div></div>' +
            html;
        }
        c.innerHTML = html;
      }

      function adminAyarlarGoster() {
        const c = document.getElementById("asekme-ayarlar");
        c.innerHTML = `
    <div class="kart">
      <div class="kart-baslik">Talep Dönemi</div>
      <p style="font-size:13px;color:#888;margin-bottom:16px;">Talep dönemi açıkken öğretmenler matrislerini doldurabilir.</p>
      <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-yesil" onclick="donemAc()" ${ayarlar.donem_acik ? "disabled" : ""}>Dönemi Aç</button>
        <button class="btn btn-kirmizi" onclick="donemKapat()" ${!ayarlar.donem_acik ? "disabled" : ""}>Dönemi Kapat</button>
        <span class="rozet ${ayarlar.donem_acik ? "rozet-yesil" : "rozet-kirmizi"}">${ayarlar.donem_acik ? "Açık" : "Kapalı"}</span>
      </div>
      <div class="mesaj" id="donemMesaj"></div>
    </div>
    <div class="kart">
      <div class="kart-baslik">Tüm Talepleri Sıfırla</div>
      <p style="font-size:13px;color:#888;margin-bottom:16px;">Tüm öğretmenlerin matrislerini siler.</p>
      <button class="btn btn-kirmizi" onclick="tumTalepleriSifirla()">Tümünü Sıfırla</button>
      <div class="mesaj" id="sifirMesaj"></div>
    </div>`;
      }

      window.donemAc = async () => {
        ayarlar.donem_acik = true;
        await setDoc(doc(db, "program_talep_ayarlar", "genel"), {
          ...ayarlar,
          guncelleme: serverTimestamp(),
        });
        await ayarlariYukle();
        adminAyarlarGoster();
      };
      window.donemKapat = async () => {
        ayarlar.donem_acik = false;
        await setDoc(doc(db, "program_talep_ayarlar", "genel"), {
          ...ayarlar,
          guncelleme: serverTimestamp(),
        });
        await ayarlariYukle();
        adminAyarlarGoster();
      };
      window.tumTalepleriSifirla = async () => {
        if (!confirm("Tüm talepler silinecek. Emin misiniz?")) return;
        const snap = await getDocs(collection(db, "program_talep_matris"));
        await Promise.all(snap.docs.map((d) => deleteDoc(d.ref)));
        tumMatrisler = {};
        mesajGoster("sifirMesaj", "Tüm talepler silindi.", "basari");
      };

      function mesajGoster(id, metin, tip) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = metin;
        el.className = "mesaj mesaj-" + tip;
        el.style.display = "block";
        if (tip !== "bilgi")
          setTimeout(() => (el.style.display = "none"), 4000);
      }
    </script>
  </body>
</html>
