                  <div class="isi-legend-item"><div class="isi-legend-renk risk-kirmizi"></div><span><strong>Kırmızı:</strong> Kapatırsanız program yerleşemez</span></div>
                  <div class="isi-legend-item"><div class="isi-legend-renk hucre-dersyok"></div><span><strong>DERS YOK:</strong> Sizin kapattığınız saat</span></div>
                  <div class="isi-legend-item"><div class="isi-legend-renk hucre-dissi" style="border:1px solid #eee;"></div><span>Sınıflarınızın dersi olmayan saat</span></div>
                </div>
                <div style="font-size:12px;color:#888;">Hücrenin üzerine gelince nedenini görebilirsiniz. Küçük sayı, o saati boş isteyen öğretmen sayısıdır.</div>
              </div>
            </div>
          </div>`;
        matrisGuncelle();
        kayitRozetGuncelle();
      }

      let sonRiskler = {};

      function matrisGuncelle() {
        const tablo = document.getElementById("benimMatris");
        if (!tablo) return;
        const id = aktifOgretmenId;
        const durum = ogretmenDurum(id, benimMatris);
        const katki = katkiHucreleri(id);
        const aktif = talepAktif();
        sonRiskler = {};

        let html = `<thead><tr><th><span class="uzun">Gün \\ Ders</span><span class="kisa">Gün</span></th>`;
        DERSLER.forEach((d) => (html += `<th><span class="uzun">${d}. Ders</span><span class="kisa">${d}</span></th>`));
        html += "</tr></thead><tbody>";

        GUNLER.forEach((g, gi) => {
          const gunAd = `<span class="uzun">${GUN_GORUNEN[gi]}</span><span class="kisa">${GUN_KISA[gi]}</span>`;
          html += aktif
            ? `<tr><td class="gun-hucre" onclick="gunKapatAc(${gi})" title="Tüm günü kapat / aç">${gunAd} <span class="gun-ikon">⛔</span></td>`
            : `<tr><td>${gunAd}</td>`;
          DERSLER.forEach((d, di) => {
            const key = matrisKey(gi, di);
            const tik = aktif ? ` onclick="hucreTikla(${gi},${di})"` : "";
            if (benimMatris[key]) {
              const kt = katki.has(key);
              const baslik = !aktif
                ? "Ders yok talebi"
                : kt
                  ? "Bu talebiniz şu anda programı açmaza sokuyor. Tıklayarak geri açabilirsiniz."
                  : "Ders yok talebi. Geri açmak için tıklayın.";
              html += `<td class="hucre-dersyok${kt ? " hucre-katki" : ""}" title="${baslik}"${tik}><div class="dersyok-ic">${kt ? "⚠ " : ""}DERS YOK</div></td>`;
              return;
            }
            if (!ogretmenSlotIlgili(id, key)) {
              html += `<td class="hucre-dissi" title="Sınıflarınızın bu saatte dersi yok">—</td>`;
              return;
            }
            if (!aktif) {
              html += `<td class="hucre-bos"></td>`;
              return;
            }
            const r = hucreRiski(id, gi, di, durum);
            sonRiskler[key] = r;
            const yog = isiYogunluk(gi, di);
            html += `<td class="risk-${r.seviye}" title="${r.neden}${yog ? " (" + yog + " öğretmen bu saati boş istiyor)" : ""}"${tik}>${yog ? `<span class="risk-not">${yog}</span>` : ""}</td>`;
          });
          html += "</tr>";
        });
        tablo.innerHTML = html + "</tbody>";

        // Özet
        const xSayisi = Object.values(benimMatris).filter(Boolean).length;
        const ozet = document.getElementById("talepOzet");
        if (ozet) {
          const esnek = Math.max(0, durum.kapasite);
          ozet.innerHTML = `<strong>${xSayisi}</strong> saat kapattınız. Programınızda kalan esneklik: <strong>${esnek}</strong> saat.`;
        }

        // Açmaz uyarısı
        let acmazHtml = "";
        Object.entries(durum.siniflar).forEach(([s, x]) => {
          if (x.eksik > 0)
            acmazHtml += `<div class="acmaz-uyari"><strong>⚠️ ${s} sınıfı açmazda</strong>Mevcut taleplerle bu sınıfın ${x.eksik} saatlik dersi yerleşemiyor. Kırmızı çerçeveli DERS YOK hücrelerinden birini açmanız önerilir.</div>`;
        });
        if (durum.kapasite < 0)
          acmazHtml += `<div class="acmaz-uyari"><strong>⚠️ Dersleriniz sığmıyor</strong>Açık bıraktığınız saatler toplam ${ogretmenToplamYuk(id)} saatlik ders yükünüzden az. Bazı DERS YOK işaretlerini kaldırın.</div>`;
        if (durum.bolunme)
          acmazHtml += `<div class="acmaz-uyari"><strong>⚠️ Bölünme sorunu</strong>Bölünmüş dersleriniz için yeterli sayıda müsait gün kalmadı.</div>`;
        const uyariEl = document.getElementById("acmazUyari");
        if (uyariEl) uyariEl.innerHTML = acmazHtml;
      }

      function kayitRozetGuncelle(durum) {
        const r = document.getElementById("kayitRozet");
        if (!r) return;
        if (durum === "kaydediliyor") {
          r.textContent = "Kaydediliyor...";
          r.className = "rozet rozet-sari";
        } else if (durum === "hata") {
          r.textContent = "Kaydedilemedi";
          r.className = "rozet rozet-kirmizi";
        } else if (kaydedilmemis) {
          r.textContent = "Kaydedilmedi";
          r.className = "rozet rozet-sari";
        } else {
          r.textContent = "Kaydedildi";
          r.className = "rozet rozet-yesil";
        }
      }

      function otomatikKaydetPlanla() {
        kaydedilmemis = true;
        kayitRozetGuncelle();
        clearTimeout(kayitZamanlayici);
        kayitZamanlayici = setTimeout(() => window.matrisKaydet(true), 1000);
      }

      window.addEventListener("beforeunload", (e) => {
        if (!kaydedilmemis) return;
        e.preventDefault();
        e.returnValue = "";
      });

      window.hucreTikla = (gi, di) => {
        if (!talepYazilabilir()) return;
        const key = matrisKey(gi, di);
        if (!benimMatris[key]) {
          const r = sonRiskler[key];
          if (r?.seviye === "kirmizi" && !confirm(r.neden + "\n\nYine de bu saati kapatmak istiyor musunuz?")) return;
          benimMatris[key] = true;
        } else {
          delete benimMatris[key];
        }
        matrisGuncelle();
        otomatikKaydetPlanla();
      };

      // Verilen hücreleri ([[gi,di],...]) tek seferde kapatır. Hücreler sırayla
      // değerlendirilir; her biri öncekiler kapatılmış varsayılarak hesaplanır,
      // böylece birikerek açmaza düşen saat doğru yakalanır. Açmaz varsa tek onay.
      function hucreleriKapat(hucreler, bosMesaj) {
        if (!talepYazilabilir()) return;
        const id = aktifOgretmenId;
        const orijinal = benimMatris;
        const deneme = { ...orijinal };
        const kapatilacak = [];
        const kirmizilar = [];
        try {
          benimMatris = deneme; // guncelMatrisAl/hucreRiski deneme kopyasını görsün
          for (const [gi, di] of hucreler) {
            const key = matrisKey(gi, di);
            if (deneme[key] || !ogretmenSlotIlgili(id, key)) continue;
            const r = hucreRiski(id, gi, di, ogretmenDurum(id, deneme));
            if (r.seviye === "kirmizi") kirmizilar.push(GUN_GORUNEN[gi] + " " + DERSLER[di] + ". ders: " + r.neden.replace(/^Bu saati kapatırsanız /, ""));
            deneme[key] = true;
            kapatilacak.push(key);
          }
        } finally {
          benimMatris = orijinal;
        }
        if (!kapatilacak.length) {
          mesajGoster("ogretmenMesaj", bosMesaj, "bilgi");
          return;
        }
        if (kirmizilar.length) {
          const ornek = kirmizilar.slice(0, 5).map((s) => "• " + s).join("\n");
          const fazla = kirmizilar.length > 5 ? "\n• ... ve " + (kirmizilar.length - 5) + " saat daha" : "";
          if (!confirm(`${kapatilacak.length} saat kapatılacak. Bunlardan ${kirmizilar.length} saat programı yerleşemez hale getiriyor:\n\n${ornek}${fazla}\n\nTamam: hepsini kapat\nİptal: vazgeç`)) return;
        }
        kapatilacak.forEach((k) => (benimMatris[k] = true));
        matrisGuncelle();
        otomatikKaydetPlanla();
        mesajGoster("ogretmenMesaj", kapatilacak.length + " saat kapatıldı." + (kirmizilar.length ? " Kırmızı çerçeveli hücreleri açmanız önerilir." : ""), kirmizilar.length ? "hata" : "basari");
      }

      // Tüm günlerde ilk..son ders indekslerini (0 tabanlı) kapatır.
      window.yarimGunKapat = (ilk, son) => {
        const hucreler = [];
        for (let gi = 0; gi < 5; gi++) for (let di = ilk; di <= son; di++) hucreler.push([gi, di]);
        hucreleriKapat(hucreler, "Bu aralıkta kapatılacak açık ders saati yok.");
      };

      // Gün adına dokununca: gün tamamen kapalıysa açar, değilse kalan saatleri kapatır.
      window.gunKapatAc = (gi) => {
        if (!talepYazilabilir()) return;
        const id = aktifOgretmenId;
        const ilgili = DERSLER.map((d, di) => di).filter((di) => ogretmenSlotIlgili(id, matrisKey(gi, di)));
        if (!ilgili.length) {
          mesajGoster("ogretmenMesaj", GUN_GORUNEN[gi] + " günü sınıflarınızın dersi yok.", "bilgi");
          return;
        }
        if (ilgili.every((di) => benimMatris[matrisKey(gi, di)])) {
          ilgili.forEach((di) => delete benimMatris[matrisKey(gi, di)]);
          matrisGuncelle();
          otomatikKaydetPlanla();
          mesajGoster("ogretmenMesaj", GUN_GORUNEN[gi] + " günü yeniden açıldı.", "basari");
          return;
        }
        hucreleriKapat(ilgili.map((di) => [gi, di]), "");
      };

      // Telefonda yatay görünüm: Android'de tam ekran + yatay kilit; desteklenmezse ipucu
      window.yatayGorunum = async () => {
        try {
          const el = document.documentElement;
          if (!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen();
          if (screen.orientation?.lock) {
            await screen.orientation.lock("landscape");
            return;
          }
          throw new Error("desteklenmiyor");
        } catch (e) {
          if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
          mesajGoster("yatayMesaj", "Telefonunuz otomatik döndürmeyi bu sayfada desteklemiyor. Ekran döndürme kilidini kapatıp telefonu yan çevirin.", "bilgi");
        }
      };
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          try { screen.orientation?.unlock?.(); } catch {}
        }
      });

      window.gerekceDegisti = (deger) => {
        if (!talepYazilabilir()) return;
        benimGerekce = deger || "";
        otomatikKaydetPlanla();
      };

      window.matrisKaydet = async (otomatik) => {
        if (!aktifOgretmenId) return;
        if (!talepYazilabilir()) return;
        clearTimeout(kayitZamanlayici);
        kayitRozetGuncelle("kaydediliyor");
        const kaydedilen = { ...benimMatris };
        try {
          await setDoc(doc(db, "program_talep_matris", aktifOgretmenId), {
            matris: kaydedilen,
            gerekce: benimGerekce,
            ogretmen_id: aktifOgretmenId,
            son_guncelleme: serverTimestamp(),
          });
          tumMatrisler[aktifOgretmenId] = kaydedilen;
          tumGerekceler[aktifOgretmenId] = benimGerekce;
          // Kayıt sırasında yeni tıklama olmadıysa kaydedildi say
          if (JSON.stringify(kaydedilen) === JSON.stringify(benimMatris)) kaydedilmemis = false;
          kayitRozetGuncelle();
          if (otomatik !== true) mesajGoster("ogretmenMesaj", "Talebiniz kaydedildi.", "basari");
        } catch (err) {
          kayitRozetGuncelle("hata");
          mesajGoster("ogretmenMesaj", "Kaydedilemedi: " + err.message, "hata");
        }
      };

      window.matrisiSifirla = () => {
        if (!talepYazilabilir()) return;
        if (!confirm("Tüm DERS YOK işaretlerini kaldırmak istiyor musunuz?")) return;
        benimMatris = {};
        matrisGuncelle();
        otomatikKaydetPlanla();
      };

      // ── ADMİN SAYFASI ──
      function adminSayfasi() {
        document.getElementById("anaIcerik").innerHTML = `
    <div class="sekme-bar">
      <button class="sekme-btn aktif" onclick="adminSekme('tanim', this)">Tanımlar</button>
      <button class="sekme-btn" onclick="adminSekme('isi', this)">Isı Haritası</button>
      <button class="sekme-btn" onclick="adminSekme('acmaz', this)">Açmaz Analizi</button>
      <button class="sekme-btn" onclick="adminSekme('programDuzenle', this)">📐 Ders Programını Düzenle</button>
      <button class="sekme-btn" onclick="adminSekme('sinifProgram', this)">🏫 Sınıf Programları</button>
      <button class="sekme-btn" onclick="adminSekme('ayarlar', this)">Ayarlar</button>
    </div>
    <div class="sekme-icerik aktif" id="asekme-tanim"></div>
    <div class="sekme-icerik" id="asekme-isi"></div>
    <div class="sekme-icerik" id="asekme-acmaz"></div>
    <div class="sekme-icerik" id="asekme-programDuzenle"></div>
    <div class="sekme-icerik" id="asekme-sinifProgram"></div>
    <div class="sekme-icerik" id="asekme-ayarlar"></div>
  `;
        adminTanimGoster();
      }

      window.adminSekme = (id, el) => {
        document
          .querySelectorAll(".sekme-btn")
          .forEach((b) => b.classList.remove("aktif"));
        document
          .querySelectorAll(".sekme-icerik")
          .forEach((s) => s.classList.remove("aktif"));
        el.classList.add("aktif");
        document.getElementById("asekme-" + id).classList.add("aktif");
        if (id === "tanim") adminTanimGoster();
        else if (id === "isi" || id === "acmaz") {
          // Ders Programını Düzenle'de yapılan değişiklikler yansısın
          const hedef = document.getElementById("asekme-" + id);
          hedef.innerHTML = '<div class="yukleniyor">Yükleniyor...</div>';
          programYukVerisiYukle()
            .then(() => (id === "isi" ? adminIsiGoster() : adminAcmazGoster()))
            .catch((err) => (hedef.innerHTML = `<div class="kart"><div class="bos-mesaj">Hata: ${err.message}</div></div>`));
        }
        else if (id === "programDuzenle") adminProgramDuzenleGoster();
        else if (id === "sinifProgram") adminSinifProgramGoster();
        else if (id === "ayarlar") adminAyarlarGoster();
      };

      function adminTanimGoster() {
        const c = document.getElementById("asekme-tanim");
        const subeler = [...new Set(tumTanimlar.map((t) => t.sube))].sort();

        // Öğretmen bazında grupla
        const ogretmenGruplari = new Map();
        tumTanimlar.forEach((t) => {
          if (!ogretmenGruplari.has(t.ogretmen_id))
            ogretmenGruplari.set(t.ogretmen_id, { ad: t.ogretmen_adi, dersler: [] });
          ogretmenGruplari.get(t.ogretmen_id).dersler.push(t);
        });

        const sinifOptions = tumSiniflar.map((s) => `<option value="${s.class_name}">${s.class_name}</option>`).join("");
        const ogretmenOptions = tumOgretmenler.map((o) => `<option value="${o.id}">${o.ad || "(isimsiz)"}</option>`).join("");
        const dersOptions = tumDersListesi.map((d) => `<option value="${d.ders_adi}">${d.ders_adi}</option>`).join("");

        let html = `<div class="kart">
          <div class="kart-baslik">
            Öğretmen Ders Tanımları
            <span class="rozet rozet-mavi">${tumTanimlar.length} kayıt — ${subeler.length} şube — ${ogretmenGruplari.size} öğretmen</span>
          </div>
          <p style="font-size:13px;color:#888;margin-bottom:14px;">Talep ısı haritası, sınıf ve saat bilgisini doğrudan yüklü ders programından alır. Tanımlar yalnızca bölünme (ör. 2+1) bilgisi için gereklidir. Eksik tanımları yüklü programdan otomatik oluşturup bölünmeyi sonra girebilirsiniz.</p>
          <div style="margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <button class="btn btn-mavi btn-sm" onclick="adminTanimProgramdanOlustur()">⚙️ Programdan oluştur</button>
            <span class="mesaj" id="adminOlusturMesaj"></span>
          </div>`;

        if (!ogretmenGruplari.size) {
          html += `<div style="color:#888;padding:20px;text-align:center;">Henüz hiçbir öğretmen ders tanımı girmemiş.</div>`;
        } else {
          ogretmenGruplari.forEach((ogr) => {
            const toplamSaat = ogr.dersler.reduce((s, t) => s + (t.haftalik_saat || 0), 0);
            html += `<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #f0f0f0;">
              <div style="font-size:13px;font-weight:700;color:#1a73e8;margin-bottom:8px;">
                👤 ${ogr.ad} <span style="color:#888;font-weight:400;">(${toplamSaat} saat / ${ogr.dersler.length} şube)</span>
              </div>
              <table style="margin:0;"><thead><tr><th>Şube</th><th>Ders</th><th>Saat</th><th>Bölünme</th><th></th></tr></thead><tbody>
              ${ogr.dersler.map((t) => `<tr>
                <td>${t.sube}</td><td>${t.ders_adi}</td><td>${t.haftalik_saat}</td>
                <td><span class="rozet rozet-mavi" style="cursor:pointer;" title="Bölünmeyi düzenle" onclick="adminBolunmeDuzenle('${t.id}')">${t.bolunme || "-"} ✎</span></td>
                <td><button class="btn btn-kirmizi btn-sm" onclick="adminTanimSil('${t.id}')">Sil</button></td>
              </tr>`).join("")}
              </tbody></table>
            </div>`;
          });
        }
        html += `</div>`;

        // Ders tanımı ekleme formu (admin için — tek giriş yolu)
        html += `<div class="kart">
          <div class="kart-baslik">Ders Tanımı Ekle</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;">
            <div class="form-group" style="margin-bottom:0;">
              <label>Öğretmen</label>
              <select id="adminTanimOgretmen"><option value="">Seçin</option>${ogretmenOptions}</select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label>Şube</label>
              <select id="adminTanimSube"><option value="">Seçin</option>${sinifOptions}</select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label>Ders Adı</label>
              <select id="adminTanimDers"><option value="">Seçin</option>${dersOptions}</select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label>Saat</label>
              <input type="number" id="adminTanimSaat" min="1" max="10" placeholder="4">
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label>Bölünme</label>
              <input type="text" id="adminTanimBolunme" placeholder="2+2">
            </div>
            <div><button class="btn btn-yesil" onclick="adminTanimEkle()">+ Ekle</button></div>
          </div>
          <div class="mesaj" id="adminTanimMesaj" style="margin-top:10px;"></div>
        </div>`;

        c.innerHTML = html;
      }

      // schedule'dan öğretmen/şube/ders bazında saat sayıp eksik tanımları ekler
      window.adminTanimProgramdanOlustur = async () => {
        mesajGoster("adminOlusturMesaj", "Program okunuyor...", "bilgi");
        try {
          const snap = await getDocs(collection(db, "schedule"));
          const gruplar = new Map();
          snap.forEach((d) => {
            const k = d.data();
            const sube = (k.class_id || "").trim();
            const ders = (k.lesson_name || "").trim();
            if (!k.teacher_id || !sube || !ders) return;
            const gk = k.teacher_id + "|" + sube + "|" + ders;
            if (!gruplar.has(gk)) gruplar.set(gk, { ogretmen_id: k.teacher_id, sube, ders_adi: ders, slotlar: new Set() });
            gruplar.get(gk).slotlar.add(normalizeGunLocal(k.day) + "-" + k.lesson_number);
          });
          const mevcut = new Set(tumTanimlar.map((t) => t.ogretmen_id + "|" + t.sube + "|" + t.ders_adi));
          const yeniler = [...gruplar.entries()]
            .filter(([gk]) => !mevcut.has(gk))
            .map(([, g]) => ({
              ogretmen_id: g.ogretmen_id,
              ogretmen_adi: ogretmenAdi(g.ogretmen_id),
              sube: g.sube,
              ders_adi: g.ders_adi,
              haftalik_saat: g.slotlar.size,
              bolunme: "",
            }));
          if (!yeniler.length) {
            mesajGoster("adminOlusturMesaj", "Eksik tanım yok; tüm dersler zaten tanımlı.", "basari");
            return;
          }
          if (!confirm(yeniler.length + " yeni tanım eklenecek. Devam edilsin mi?")) {
            mesajGoster("adminOlusturMesaj", "", "bilgi");
            return;
          }
          for (let i = 0; i < yeniler.length; i += 400) {
            const batch = writeBatch(db);
            yeniler.slice(i, i + 400).forEach((t) => {
              const ref = doc(collection(db, "program_talep_tanimlar"));
              batch.set(ref, t);
              t.id = ref.id;
            });
            await batch.commit();
          }
          tumTanimlar.push(...yeniler);
          adminTanimGoster();
          mesajGoster("adminOlusturMesaj", yeniler.length + " tanım eklendi. Bölünme bilgilerini girebilirsiniz.", "basari");
        } catch (err) {
          mesajGoster("adminOlusturMesaj", "Hata: " + err.message, "hata");
        }
      };

      window.adminBolunmeDuzenle = async (id) => {
        const t = tumTanimlar.find((x) => x.id === id);
        if (!t) return;
        const yeni = prompt(`${t.ogretmen_adi} — ${t.sube} ${t.ders_adi} (${t.haftalik_saat} saat)\nBölünme (ör. 2+1, boş bırakılabilir):`, t.bolunme || "");
        if (yeni === null) return;
        const deger = yeni.replace(/\s/g, "");
        if (deger && !/^\d+(\+\d+)*$/.test(deger)) {
          alert("Bölünme 2+1 biçiminde olmalı.");
          return;
        }
        await updateDoc(doc(db, "program_talep_tanimlar", id), { bolunme: deger });
        t.bolunme = deger;
        adminTanimGoster();
      };

      window.adminTanimSil = async (id) => {
        if (!confirm("Bu tanımı silmek istiyor musunuz?")) return;
        await deleteDoc(doc(db, "program_talep_tanimlar", id));
        tumTanimlar = tumTanimlar.filter((t) => t.id !== id);
        adminTanimGoster();
      };

      window.adminTanimEkle = async () => {
        const ogrSel = document.getElementById("adminTanimOgretmen");
        const ogrId = ogrSel?.value;
        const ogrAd = ogrSel?.selectedOptions?.[0]?.textContent?.trim() || "";
        const sube = document.getElementById("adminTanimSube")?.value?.trim();
        const dersAdi = document.getElementById("adminTanimDers")?.value?.trim();
        const saat = parseInt(document.getElementById("adminTanimSaat")?.value || "0");
        const bolunme = document.getElementById("adminTanimBolunme")?.value?.trim() || "";
        if (!ogrId || !sube || !dersAdi || !saat) {
          mesajGoster("adminTanimMesaj", "Tüm alanları doldurun.", "hata");
          return;
        }
        mesajGoster("adminTanimMesaj", "Ekleniyor...", "bilgi");
        const docRef = await addDoc(collection(db, "program_talep_tanimlar"), {
          ogretmen_id: ogrId, ogretmen_adi: ogrAd, sube, ders_adi: dersAdi, haftalik_saat: saat, bolunme,
        });
        tumTanimlar.push({ id: docRef.id, ogretmen_id: ogrId, ogretmen_adi: ogrAd, sube, ders_adi: dersAdi, haftalik_saat: saat, bolunme });
        mesajGoster("adminTanimMesaj", "Tanım eklendi.", "basari");
        adminTanimGoster();
      };

      let adminFiltre = { ad: "", sinif: "", gerekce: "", sadeceAcmaz: false };

      function adminIsiGoster() {
        const c = document.getElementById("asekme-isi");
        const sinifSec = Object.keys(sinifSlotlari)
          .sort((a, b) => a.localeCompare(b, "tr", { numeric: true }))
          .map((s) => `<option value="${s}"${adminFiltre.sinif === s ? " selected" : ""}>${s}</option>`)
          .join("");
        const gerekceSec = GEREKCELER.map(
          (g) => `<option value="${g.kod}"${adminFiltre.gerekce === g.kod ? " selected" : ""}>${g.ad}</option>`,
        ).join("");
        c.innerHTML = `
          <div id="adminIsiGenel"></div>
          <div class="kart">
            <div class="kart-baslik">
              Öğretmen Talep Matrisleri
              <span class="rozet rozet-mavi" id="adminMatrisSayac">—</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;">
              <input type="text" placeholder="Öğretmen ara..." value="${adminFiltre.ad}" oninput="adminFiltreDegis('ad', this.value)" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;">
              <select onchange="adminFiltreDegis('sinif', this.value)" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;"><option value="">Tüm sınıflar</option>${sinifSec}</select>
              <select onchange="adminFiltreDegis('gerekce', this.value)" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;">
                <option value="">Tüm gerekçeler</option>${gerekceSec}<option value="-"${adminFiltre.gerekce === "-" ? " selected" : ""}>Belirtilmemiş</option>
              </select>
              <label style="font-size:13px;display:flex;gap:4px;align-items:center;"><input type="checkbox" ${adminFiltre.sadeceAcmaz ? "checked" : ""} onchange="adminFiltreDegis('sadeceAcmaz', this.checked)"> Sadece açmaza katkı verenler</label>
            </div>
            <div style="font-size:12px;color:#888;margin-bottom:10px;">Kırmızı çerçeveli DERS YOK hücreleri, bir sınıfın programını yerleşemez hale getiren taleplerdir. Gri hücreler öğretmenin sınıflarında dersi olmayan saatlerdir.</div>
            <div class="mini-grid" id="adminMatrisIzgara"></div>
          </div>
          <div id="adminUyumTablo"></div>`;
        adminIsiIcerikCiz();
      }

      window.adminFiltreDegis = (alan, deger) => {
        adminFiltre[alan] = deger;
        adminMatrisIzgaraCiz();
      };

      function adminIsiIcerikCiz() {
        adminGenelIsiCiz();
        adminMatrisIzgaraCiz();
        adminUyumTabloCiz();
      }

      function adminGenelIsiCiz() {
        const el = document.getElementById("adminIsiGenel");
        if (!el) return;
        const toplamOgr = Object.values(tumMatrisler).filter((m) => Object.values(m).some(Boolean)).length;
        let maxY = 1;
        for (let gi = 0; gi < 5; gi++) for (let di = 0; di < 8; di++) maxY = Math.max(maxY, isiYogunluk(gi, di));

        let html = `<div class="kart">
          <div class="kart-baslik">
            Genel Isı Haritası (kaç öğretmen boş istiyor)
            <div style="display:flex;gap:8px;">
              <span class="rozet rozet-mavi">${toplamOgr} öğretmen talep girdi</span>
              <button class="btn btn-gri btn-sm" onclick="window.print()">Yazdır</button>
            </div>
          </div>
          <div class="isi-legend">
            <div class="isi-legend-item"><div class="isi-legend-renk isi-0"></div><span>0 kişi</span></div>
            <div class="isi-legend-item"><div class="isi-legend-renk isi-2"></div><span>Az</span></div>
            <div class="isi-legend-item"><div class="isi-legend-renk isi-4"></div><span>Yoğun</span></div>
            <div class="isi-legend-item"><div class="isi-legend-renk isi-6"></div><span>Çok yoğun</span></div>
          </div>
          <div class="matris-wrap"><table class="matris"><thead><tr><th>Gün \\ Ders</th>`;
        DERSLER.forEach((d) => (html += "<th>" + d + ". Ders</th>"));
        html += "</tr></thead><tbody>";
        GUNLER.forEach((g, gi) => {
          html += "<tr><td>" + g + "</td>";
          DERSLER.forEach((d, di) => {
            const y = isiYogunluk(gi, di);
            const seviye = Math.min(6, Math.floor((y / maxY) * 6));
            html += `<td class="isi-${seviye}" title="${y} öğretmen boş istiyor" style="font-size:11px;font-weight:700;">${y || ""}</td>`;
          });
          html += "</tr>";
        });
        el.innerHTML = html + "</tbody></table></div></div>";
      }

      function talepGirenOgretmenler() {
        return Object.keys(tumMatrisler)
          .filter((id) => Object.values(tumMatrisler[id]).some(Boolean) || tumGerekceler[id])
          .sort((a, b) => ogretmenAdi(a).localeCompare(ogretmenAdi(b), "tr"));
      }

      function gerekceRozet(id) {
        const g = tumGerekceler[id];
        return g
          ? `<span class="rozet rozet-mavi">${gerekceAdi(g)}</span>`
          : `<span class="rozet" style="background:#f1f3f4;color:#888;">Belirtilmemiş</span>`;
      }

      function adminMatrisIzgaraCiz() {
        const el = document.getElementById("adminMatrisIzgara");
        if (!el) return;
        const f = adminFiltre;
        const aranan = (f.ad || "").toLocaleLowerCase("tr");
        const ids = talepGirenOgretmenler().filter((id) => {
          if (aranan && !ogretmenAdi(id).toLocaleLowerCase("tr").includes(aranan)) return false;
          if (f.sinif && !ogretmenYuk[id]?.[f.sinif]) return false;
          if (f.gerekce === "-" && tumGerekceler[id]) return false;
          if (f.gerekce && f.gerekce !== "-" && tumGerekceler[id] !== f.gerekce) return false;
          if (f.sadeceAcmaz && !katkiHucreleri(id).size) return false;
          return true;
        });
        document.getElementById("adminMatrisSayac").textContent = ids.length + " öğretmen";
        if (!ids.length) {
          el.innerHTML = `<div class="bos-mesaj" style="grid-column:1/-1;">Filtreye uyan talep yok.</div>`;
          return;
        }
        el.innerHTML = ids
          .map((id) => {
            const kapali = Object.values(tumMatrisler[id]).filter(Boolean).length;
            const acmaz = katkiHucreleri(id).size > 0;
            return `<div class="mini-kart"${acmaz ? ' style="border-color:#f28b82;"' : ""}>
              <div class="mini-kart-baslik">
                <span style="cursor:pointer;color:#1a73e8;" onclick="adminMatrisGor('${id}')">${ogretmenAdi(id)}</span>
                ${gerekceRozet(id)}
              </div>
              <div style="font-size:11px;color:#888;margin-bottom:4px;">${kapali} saat kapalı · ${ogretmenToplamYuk(id)} saat ders${acmaz ? ' · <strong style="color:#c5221f;">⚠ açmaz</strong>' : ""}</div>
              ${talepMatrisHtml(id, true)}
            </div>`;
          })
          .join("");
      }

      function adminUyumTabloCiz() {
        const el = document.getElementById("adminUyumTablo");
        if (!el) return;
        let html = `<div class="kart"><div class="kart-baslik">Öğretmen Talep Özeti</div>
          <table><thead><tr><th>Öğretmen</th><th>Kapalı saat</th><th>Ders yükü</th><th>Esneklik</th><th>Gerekçe</th><th>Durum</th><th></th></tr></thead><tbody>`;
        talepGirenOgretmenler().forEach((id) => {
          const matris = tumMatrisler[id];
          const d = ogretmenDurum(id, matris);
          const acmaz = durumAcmaz(d);
          const sikisik = !acmaz && d.kapasite <= SARI_KAPASITE_ESIGI;
          const durum = acmaz
            ? '<span class="rozet rozet-kirmizi">Açmaz</span>'
            : sikisik
              ? '<span class="rozet rozet-sari">Sıkışık</span>'
              : '<span class="rozet rozet-yesil">Uygun</span>';
          html += `<tr><td>${ogretmenAdi(id)}</td><td>${Object.values(matris).filter(Boolean).length}</td><td>${ogretmenToplamYuk(id)}</td>
            <td>${d.kapasite}</td><td>${gerekceRozet(id)}</td><td>${durum}</td>
            <td><button class="btn btn-gri btn-sm" onclick="adminMatrisGor('${id}')">Görüntüle</button></td></tr>`;
        });
        el.innerHTML = html + "</tbody></table></div>";
      }

      window.adminMatrisGor = (id) => {
        const ad = ogretmenAdi(id);
        document.getElementById("adminMatrisOverlay")?.remove();
        const overlay = document.createElement("div");
        overlay.id = "adminMatrisOverlay";
        overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;";
        overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
        const yukSatir = ogretmenSiniflari(id).map((s) => `${s}: ${ogretmenYuk[id][s].saat}`).join(" · ");
        overlay.innerHTML = `<div class="kart" style="max-width:760px;width:100%;max-height:90vh;overflow:auto;">
          <div class="kart-baslik">${ad} — Talep Matrisi
            <button class="btn btn-gri btn-sm" onclick="document.getElementById('adminMatrisOverlay').remove()">Kapat</button>
          </div>
          <div style="font-size:13px;color:#555;margin-bottom:10px;">Gerekçe: ${gerekceRozet(id)} &nbsp; Ders yükü: ${yukSatir || "-"}</div>
          <div class="matris-wrap">${talepMatrisHtml(id, false)}</div>
        </div>`;
        document.body.appendChild(overlay);
      };

      function adminAcmazGoster() {
        const c = document.getElementById("asekme-acmaz");
        const siniflar = Object.keys(sinifSlotlari).sort((a, b) => a.localeCompare(b, "tr", { numeric: true }));
        if (!siniflar.length) {
          c.innerHTML = '<div class="kart"><div class="bos-mesaj">Yüklü ders programı bulunamadı.</div></div>';
          return;
        }
        let acmazSayisi = 0;
        let sikisikSayisi = 0;
        const satirlar = siniflar.map((s) => {
          const x = sinifEslesme(s);
          const enAzAday = Math.min(...Object.values(x.aday));
          const kritikSaatler = Object.entries(x.aday)
            .filter(([, n]) => n <= SARI_ADAY_ESIGI)
            .map(([k, n]) => `${k.replace("-", " ")}. (${n})`);
          // Sınıfa giren ve bu sınıfın açmazına katkı veren öğretmenler
          const ilgili = [...new Set((sinifBirimleri[s] || []).flatMap((b) => b.ogretmenler))];
          const katkiVeren = x.eksik > 0 ? ilgili.filter((id) => katkiHucreleri(id).size) : [];
          let durum;
          if (x.eksik > 0) {
            acmazSayisi++;
            durum = `<span class="rozet rozet-kirmizi">⚠ ${x.eksik} saat yerleşemiyor</span>`;
          } else if (kritikSaatler.length) {
            sikisikSayisi++;
            durum = '<span class="rozet rozet-sari">Sıkışık</span>';
          } else durum = '<span class="rozet rozet-yesil">✓ Uygun</span>';
          return `<tr><td><strong>${s}</strong></td><td>${x.toplam}</td><td>${x.eslesen}</td><td>${durum}</td>
            <td>${enAzAday}</td>
            <td style="font-size:12px;">${kritikSaatler.join(", ") || "-"}</td>
            <td style="font-size:12px;">${katkiVeren.map((id) => `<a href="#" onclick="adminMatrisGor('${id}');return false;">${ogretmenAdi(id)}</a>`).join(", ") || "-"}</td></tr>`;
        });
        c.innerHTML = `
          <div class="kart">
            <div class="kart-baslik">Sınıf Bazlı Yerleşebilirlik Analizi
              <div style="display:flex;gap:6px;">
                <span class="rozet rozet-kirmizi">${acmazSayisi} açmaz</span>
                <span class="rozet rozet-sari">${sikisikSayisi} sıkışık</span>
              </div>
            </div>
            <p style="font-size:12px;color:#888;margin-bottom:10px;">Her sınıfın yüklü programdaki ders saatleri, öğretmenlerin DERS YOK talepleriyle eşleştirilir. "Yerleşebilen" toplamdan azsa bu taleplerle sınıfın programı kesinlikle yapılamaz. "En az aday", sınıfın herhangi bir ders saatinde girebilecek en az öğretmen sayısıdır; ${SARI_ADAY_ESIGI} veya altı sıkışık sayılır.</p>
            <div class="matris-wrap"><table><thead><tr><th>Sınıf</th><th>Toplam saat</th><th>Yerleşebilen</th><th>Durum</th><th>En az aday</th><th>Kritik saatler (aday)</th><th>Açmaza katkı veren</th></tr></thead>
            <tbody>${satirlar.join("")}</tbody></table></div>
          </div>`;
      }

      // ── DERS PROGRAMINI DÜZENLE (admin) ──
      function adminProgramDuzenleGoster() {
        const c = document.getElementById("asekme-programDuzenle");
        const ogretmenOptions = tumOgretmenler
          .map((o) => `<option value="${o.id}">${o.ad || "(isimsiz)"}</option>`)
          .join("");
        c.innerHTML = `<div class="kart">
          <div class="kart-baslik">Ders Programını Düzenle</div>
          <p style="font-size:13px;color:#888;margin-bottom:14px;">Bir öğretmen seçip hücrelere tıklayarak o saatteki dersi değiştirebilir veya boşaltabilirsiniz. Ufak düzeltmeler için veri import etmeye gerek kalmaz. Değişiklikler bir sonraki günün ders oluşturma işleminden (gece 03:00) itibaren geçerli olur; bugünü de düzeltmek için Genel Durum'daki "Bugünün Derslerini Oluştur" kullanılmalı.</p>
          <div class="form-group" style="max-width:320px;">
            <label>Öğretmen</label>
            <select id="programOgretmenSec" onchange="programOgretmenSecildi()"><option value="">Seçin</option>${ogretmenOptions}</select>
          </div>
          <div id="programMatrisAlani"></div>
        </div>`;
      }

      window.programOgretmenSecildi = async () => {
        const id = document.getElementById("programOgretmenSec").value;
        programSeciliOgretmenId = id || null;
        const alan = document.getElementById("programMatrisAlani");
        if (!programSeciliOgretmenId) { alan.innerHTML = ""; return; }
        alan.innerHTML = '<div class="yukleniyor">Yükleniyor...</div>';
        await programOgretmenScheduleYukle();
        programMatrisGuncelle();
      };

      async function programOgretmenScheduleYukle() {
        const snap = await getDocs(
          query(collection(db, "schedule"), where("teacher_id", "==", programSeciliOgretmenId)),
        );
        programOgretmenSchedule = {};
        snap.forEach((d) => {
          const v = d.data();
          const key = normalizeGunLocal(v.day) + "-" + v.lesson_number;
          programOgretmenSchedule[key] = { id: d.id, class_id: v.class_id || "", lesson_name: v.lesson_name || "" };
        });
      }

      function programMatrisGuncelle(alanId = "programMatrisAlani", saltOkunur = false) {
        const alan = document.getElementById(alanId);
        if (!alan) return;
        // Ogretmen ekraninda toplam rozette gosteriliyor; admin icin matrisin ustune yaz.
        let html = saltOkunur
          ? ""
          : `<div style="font-size:13px;color:#888;margin-bottom:10px;">Toplam: <strong style="color:#1a73e8;">${Object.keys(programOgretmenSchedule).length} ders saati / hafta</strong></div>`;
        html += `<div class="matris-wrap"><table class="matris${saltOkunur ? " salt-okunur" : ""}"><thead><tr><th>Gün \\ Ders</th>`;
        DERSLER.forEach((d) => { html += "<th>" + d + ". Ders</th>"; });
        html += "</tr></thead><tbody>";
        GUNLER.forEach((g, gi) => {
          html += "<tr><td>" + g + "</td>";
          DERSLER.forEach((d, di) => {
            const key = normalizeGunLocal(g) + "-" + d;
            const hucre = programOgretmenSchedule[key];
            html += `<td class="${hucre ? "hucre-x" : "hucre-bos"}"${saltOkunur ? "" : ` onclick="programHucreDuzenle(${gi},${di})"`}>`;
            html += hucre
              ? `<div style="font-size:11px;font-weight:700;color:#0d47a1;line-height:1.3;">${hucre.class_id}</div><div style="font-size:10px;color:#666;line-height:1.2;">${hucre.lesson_name}</div>`
              : '<div style="color:#ccc;">—</div>';
            html += "</td>";
          });
          html += "</tr>";
        });
        html += "</tbody></table></div>";
        alan.innerHTML = html;
      }

      window.programHucreDuzenle = (gi, di) => {
        const gun = GUNLER[gi];
        const dersNo = DERSLER[di];
        const key = normalizeGunLocal(gun) + "-" + dersNo;
        const mevcut = programOgretmenSchedule[key];
        document.getElementById("programHucreOverlay")?.remove();
        const sinifOptions = tumSiniflar
          .map((s) => `<option value="${s.class_name}"${mevcut && mevcut.class_id === s.class_name ? " selected" : ""}>${s.class_name}</option>`)
          .join("");
        const dersOptions = tumDersListesi
          .map((d) => `<option value="${d.ders_adi}"${mevcut && mevcut.lesson_name === d.ders_adi ? " selected" : ""}>${d.ders_adi}</option>`)
          .join("");
        const overlay = document.createElement("div");
        overlay.id = "programHucreOverlay";
        overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;";
        overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
        overlay.innerHTML = `<div class="kart" style="max-width:420px;width:100%;">
          <div class="kart-baslik">${gun} — ${dersNo}. Ders
            <button class="btn btn-gri btn-sm" onclick="document.getElementById('programHucreOverlay').remove()">Kapat</button>
          </div>
          <div class="form-group">
            <label>Sınıf</label>
            <select id="programHucreSinif"><option value="">Seçin</option>${sinifOptions}</select>
          </div>
          <div class="form-group">
            <label>Ders Adı</label>
            <select id="programHucreDers"><option value="">Seçin</option>${dersOptions}</select>
          </div>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-yesil" onclick="programHucreKaydet(${gi},${di})">💾 Kaydet</button>
            ${mevcut ? `<button class="btn btn-kirmizi" onclick="programHucreBosalt(${gi},${di})">Boşalt</button>` : ""}
          </div>
          <div class="mesaj" id="programHucreMesaj" style="margin-top:10px;"></div>
        </div>`;
        document.body.appendChild(overlay);
      };

      window.programHucreKaydet = async (gi, di) => {
        const gun = GUNLER[gi];
        const dersNo = DERSLER[di];
        const key = normalizeGunLocal(gun) + "-" + dersNo;
        const sinif = document.getElementById("programHucreSinif").value;
        const dersAdi = document.getElementById("programHucreDers").value;
        if (!sinif || !dersAdi) { mesajGoster("programHucreMesaj", "Sınıf ve ders adını seçin.", "hata"); return; }
        const mevcut = programOgretmenSchedule[key];
        try {
          if (mevcut) {
            await updateDoc(doc(db, "schedule", mevcut.id), { class_id: sinif, lesson_name: dersAdi });
          } else {
            await addDoc(collection(db, "schedule"), {
              teacher_id: programSeciliOgretmenId,
              day: gun,
              lesson_number: dersNo,
              class_id: sinif,
              lesson_name: dersAdi,
              created_at: serverTimestamp(),
            });
          }
          document.getElementById("programHucreOverlay")?.remove();
          await programOgretmenScheduleYukle();
          programMatrisGuncelle();
        } catch (err) {
          mesajGoster("programHucreMesaj", "Hata: " + err.message, "hata");
        }
      };

      window.programHucreBosalt = async (gi, di) => {
        const gun = GUNLER[gi];
        const dersNo = DERSLER[di];
        const key = normalizeGunLocal(gun) + "-" + dersNo;
        const mevcut = programOgretmenSchedule[key];
        if (!mevcut) return;
        if (!confirm("Bu ders saatini boşaltmak istiyor musunuz?")) return;
        await deleteDoc(doc(db, "schedule", mevcut.id));
        document.getElementById("programHucreOverlay")?.remove();
        await programOgretmenScheduleYukle();
        programMatrisGuncelle();
      };

      // ── SINIF PROGRAMLARI (admin) ──
      // "Ders Programını Düzenle" ile ayni schedule verisi, sinif bazli gorunum.
      // Bir hucrede birden fazla kayit olabilir (grup dersleri); hepsi listelenir.
      let sinifProgSecili = null;
      let sinifProgSchedule = {}; // { "gun-ders": [{ id, teacher_id, lesson_name }] }

      function escHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      function adminSinifProgramGoster() {
        const c = document.getElementById("asekme-sinifProgram");
        const sinifOptions = [...tumSiniflar]
          .sort((a, b) => String(a.class_name).localeCompare(String(b.class_name), "tr", { numeric: true }))
          .map((s) => `<option value="${escHtml(s.class_name)}"${s.class_name === sinifProgSecili ? " selected" : ""}>${escHtml(s.class_name)}</option>`)
          .join("");
        c.innerHTML = `<div class="kart">
          <div class="kart-baslik">Sınıf Programları</div>
          <p style="font-size:13px;color:#888;margin-bottom:14px;">Bir sınıf seçip hücrelere tıklayarak o saatteki dersi ve öğretmenini değiştirebilir veya boşaltabilirsiniz. Öğretmenin aynı saatte başka sınıfta dersi varsa kayıt engellenir. Değişiklikler bir sonraki günün ders oluşturma işleminden (gece 03:00) itibaren geçerli olur; bugünü de düzeltmek için Genel Durum'daki "Bugünün Derslerini Oluştur" kullanılmalı.</p>
          <div class="form-group" style="max-width:320px;">
            <label>Sınıf</label>
            <select id="sinifProgSec" onchange="sinifProgSecildi()"><option value="">Seçin</option>${sinifOptions}</select>
          </div>
          <div id="sinifProgAlani"></div>
        </div>`;
        if (sinifProgSecili) sinifProgSecildi();
      }

      window.sinifProgSecildi = async () => {
        sinifProgSecili = document.getElementById("sinifProgSec").value || null;
        const alan = document.getElementById("sinifProgAlani");
        if (!sinifProgSecili) { alan.innerHTML = ""; return; }
        alan.innerHTML = '<div class="yukleniyor">Yükleniyor...</div>';
        await sinifProgYukle();
        sinifProgCiz();
      };

      async function sinifProgYukle() {
        const snap = await getDocs(query(collection(db, "schedule"), where("class_id", "==", sinifProgSecili)));
        sinifProgSchedule = {};
        snap.forEach((d) => {
          const v = d.data();
          const key = normalizeGunLocal(v.day) + "-" + v.lesson_number;
          (sinifProgSchedule[key] ||= []).push({ id: d.id, teacher_id: v.teacher_id || "", lesson_name: v.lesson_name || "" });
        });
      }

      function sinifProgCiz() {
        const alan = document.getElementById("sinifProgAlani");
        if (!alan) return;
        let html = '<div class="matris-wrap"><table class="matris"><thead><tr><th>Gün \\ Ders</th>';
        DERSLER.forEach((d) => { html += "<th>" + d + ". Ders</th>"; });
        html += "</tr></thead><tbody>";
        GUNLER.forEach((g, gi) => {
          html += "<tr><td>" + g + "</td>";
          DERSLER.forEach((d, di) => {
            const kayitlar = sinifProgSchedule[normalizeGunLocal(g) + "-" + d] || [];
            html += `<td class="${kayitlar.length ? "hucre-x" : "hucre-bos"}" onclick="sinifHucreDuzenle(${gi},${di})">`;
            html += kayitlar.length
              ? kayitlar.map((k) => `<div style="font-size:11px;font-weight:700;color:#0d47a1;line-height:1.3;">${escHtml(k.lesson_name)}</div><div style="font-size:10px;color:#666;line-height:1.2;">${escHtml(ogretmenAdi(k.teacher_id))}</div>`).join('<div style="border-top:1px dashed #ccc;margin:2px 0;"></div>')
              : '<div style="color:#ccc;">—</div>';
            html += "</td>";
          });
          html += "</tr>";
        });
        html += "</tbody></table></div>";
        alan.innerHTML = html;
      }

      // duzenlenenId: guncellenecek schedule kaydi; null ise yeni kayit eklenir,
      // verilmezse hucrede tek kayit varsa o secilir.
      window.sinifHucreDuzenle = (gi, di, duzenlenenId) => {
        const gun = GUNLER[gi];
        const dersNo = DERSLER[di];
        const kayitlar = sinifProgSchedule[normalizeGunLocal(gun) + "-" + dersNo] || [];
        if (duzenlenenId === undefined) duzenlenenId = kayitlar.length === 1 ? kayitlar[0].id : null;
        const mevcut = kayitlar.find((k) => k.id === duzenlenenId) || null;
        document.getElementById("programHucreOverlay")?.remove();

        const ogretmenOptions = tumOgretmenler
          .map((o) => `<option value="${escHtml(o.id)}"${mevcut && mevcut.teacher_id === o.id ? " selected" : ""}>${escHtml(o.ad || "(isimsiz)")}</option>`)
          .join("");
        const dersOptions = tumDersListesi
          .map((d) => `<option value="${escHtml(d.ders_adi)}"${mevcut && mevcut.lesson_name === d.ders_adi ? " selected" : ""}>${escHtml(d.ders_adi)}</option>`)
          .join("");
        const liste = kayitlar.length > 1
          ? `<div style="margin-bottom:12px;">${kayitlar.map((k) => `
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee;font-size:13px;">
                <span><strong>${escHtml(k.lesson_name)}</strong> — ${escHtml(ogretmenAdi(k.teacher_id))}</span>
                <span style="display:flex;gap:6px;">
                  <button class="btn btn-gri btn-sm" onclick="sinifHucreDuzenle(${gi},${di},'${k.id}')">Düzenle</button>
                  <button class="btn btn-kirmizi btn-sm" onclick="sinifHucreSil('${k.id}')">Sil</button>
                </span>
              </div>`).join("")}</div>`
          : "";

        const overlay = document.createElement("div");
        overlay.id = "programHucreOverlay";
        overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;";
        overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
        overlay.innerHTML = `<div class="kart" style="max-width:440px;width:100%;">
          <div class="kart-baslik">${escHtml(sinifProgSecili)} — ${gun} ${dersNo}. Ders
            <button class="btn btn-gri btn-sm" onclick="document.getElementById('programHucreOverlay').remove()">Kapat</button>
          </div>
          ${liste}
          <div style="font-size:12px;color:#888;margin-bottom:8px;">${mevcut ? "Seçili kaydı düzenliyorsunuz." : kayitlar.length ? "Bu saate ayrı bir kayıt (grup dersi) ekliyorsunuz." : "Bu saate ders ekliyorsunuz."}</div>
          <div class="form-group">
            <label>Öğretmen</label>
            <select id="sinifHucreOgretmen"><option value="">Seçin</option>${ogretmenOptions}</select>
          </div>
          <div class="form-group">
            <label>Ders Adı</label>
            <select id="sinifHucreDers"><option value="">Seçin</option>${dersOptions}</select>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-yesil" onclick="sinifHucreKaydet(${gi},${di},${mevcut ? `'${mevcut.id}'` : "null"})">💾 Kaydet</button>
            ${mevcut ? `<button class="btn btn-kirmizi" onclick="sinifHucreSil('${mevcut.id}')">Boşalt</button>` : ""}
            ${mevcut ? `<button class="btn btn-gri" onclick="sinifHucreDuzenle(${gi},${di},null)">+ Ayrı kayıt ekle</button>` : ""}
          </div>
          <div class="mesaj" id="sinifHucreMesaj" style="margin-top:10px;"></div>
        </div>`;
        document.body.appendChild(overlay);
      };

      window.sinifHucreKaydet = async (gi, di, duzenlenenId) => {
        const gun = GUNLER[gi];
        const dersNo = DERSLER[di];
        const ogretmenId = document.getElementById("sinifHucreOgretmen").value;
        const dersAdi = document.getElementById("sinifHucreDers").value;
        if (!ogretmenId || !dersAdi) { mesajGoster("sinifHucreMesaj", "Öğretmen ve ders adını seçin.", "hata"); return; }
        try {
          // Cakisma: ogretmenin ayni gun/saatte baska bir sinifta dersi var mi?
          const ogrSnap = await getDocs(query(collection(db, "schedule"), where("teacher_id", "==", ogretmenId)));
          const cakisan = ogrSnap.docs.find((d) => {
            const v = d.data();
            return d.id !== duzenlenenId &&
              normalizeGunLocal(v.day) === normalizeGunLocal(gun) &&
              Number(v.lesson_number) === dersNo &&
              v.class_id !== sinifProgSecili;
          });
          if (cakisan) {
            mesajGoster("sinifHucreMesaj", `${ogretmenAdi(ogretmenId)} öğretmeninin bu saatte ${cakisan.data().class_id} sınıfında dersi var.`, "hata");
            return;
          }
          if (duzenlenenId) {
            await updateDoc(doc(db, "schedule", duzenlenenId), { teacher_id: ogretmenId, lesson_name: dersAdi });
          } else {
            await addDoc(collection(db, "schedule"), {
              teacher_id: ogretmenId,
              day: gun,
              lesson_number: dersNo,
              class_id: sinifProgSecili,
              lesson_name: dersAdi,
              created_at: serverTimestamp(),
            });
          }
          document.getElementById("programHucreOverlay")?.remove();
          await sinifProgYukle();
          sinifProgCiz();
        } catch (err) {
          mesajGoster("sinifHucreMesaj", "Hata: " + err.message, "hata");
        }
      };

      window.sinifHucreSil = async (kayitId) => {
        if (!confirm("Bu ders kaydını silmek istiyor musunuz?")) return;
        try {
          await deleteDoc(doc(db, "schedule", kayitId));
          document.getElementById("programHucreOverlay")?.remove();
          await sinifProgYukle();
          sinifProgCiz();
        } catch (err) {
          mesajGoster("sinifHucreMesaj", "Hata: " + err.message, "hata");
        }
      };

      function adminAyarlarGoster() {
        const c = document.getElementById("asekme-ayarlar");
        c.innerHTML = `
    <div class="kart">
      <div class="kart-baslik">Talep Dönemi</div>
      <p style="font-size:13px;color:#888;margin-bottom:16px;">Talep dönemi açıkken ve son talep günü geçmemişken öğretmenler yalnızca istek matrisini görür ve doldurabilir. Süre dolunca talepler kilitlenir; öğretmenler kendi taleplerini salt okunur görür ve Derslerim / Ders Programım menüleri açılır.</p>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button class="btn btn-yesil" onclick="donemAc()" ${ayarlar.donem_acik ? "disabled" : ""}>Dönemi Aç</button>
        <button class="btn btn-kirmizi" onclick="donemKapat()" ${!ayarlar.donem_acik ? "disabled" : ""}>Dönemi Kapat</button>
        <span class="rozet ${talepAktif() ? "rozet-yesil" : "rozet-kirmizi"}">${talepDurumMetni()}</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:16px;">
        <div class="form-group" style="margin-bottom:0;">
          <label>Son talep günü (gün sonuna kadar)</label>
          <input type="date" id="talepSonTarih" value="${ayarlar.son_tarih || ""}">
        </div>
        <button class="btn btn-mavi" onclick="sonTarihKaydet()">Tarihi Kaydet</button>
        ${ayarlar.son_tarih ? `<button class="btn btn-gri" onclick="sonTarihKaldir()">Tarihi Kaldır</button>` : ""}
      </div>
      <div class="mesaj" id="donemMesaj"></div>
    </div>
    <div class="kart">
      <div class="kart-baslik">Tüm Talepleri Sıfırla</div>
      <p style="font-size:13px;color:#888;margin-bottom:16px;">Tüm öğretmenlerin matrislerini siler.</p>
      <button class="btn btn-kirmizi" onclick="tumTalepleriSifirla()">Tümünü Sıfırla</button>
      <div class="mesaj" id="sifirMesaj"></div>
    </div>`;
      }

      function talepDurumMetni() {
        if (!ayarlar.donem_acik) return "Kapalı";
        if (!ayarlar.son_tarih) return "Açık — son tarih yok";
        return talepAktif()
          ? `Açık — son gün ${tarihTR(ayarlar.son_tarih)} (${kalanGunMetni()})`
          : `Süre doldu (${tarihTR(ayarlar.son_tarih)})`;
      }

      async function talepAyarKaydet(degisiklik) {
        Object.assign(ayarlar, degisiklik);
        await setDoc(doc(db, "program_talep_ayarlar", "genel"), {
          ...ayarlar,
          guncelleme: serverTimestamp(),
        });
        await ayarlariYukle();
        adminAyarlarGoster();
      }

      window.sonTarihKaydet = async () => {
        const t = document.getElementById("talepSonTarih").value;
        if (!t) {
          mesajGoster("donemMesaj", "Bir tarih seçin.", "hata");
          return;
        }
        try {
          await talepAyarKaydet({ son_tarih: t, son_zaman: Timestamp.fromDate(new Date(t + "T23:59:59+03:00")) });
          mesajGoster("donemMesaj", "Son talep günü kaydedildi: " + tarihTR(t), "basari");
        } catch (e) {
          mesajGoster("donemMesaj", "Kaydedilemedi: " + e.message, "hata");
        }
      };

      window.sonTarihKaldir = async () => {
        if (!confirm("Son talep tarihi kaldırılsın mı? Dönem, siz kapatana kadar açık kalır.")) return;
        try {
          await talepAyarKaydet({ son_tarih: null, son_zaman: null });
          mesajGoster("donemMesaj", "Son talep tarihi kaldırıldı.", "basari");
        } catch (e) {
          mesajGoster("donemMesaj", "Kaydedilemedi: " + e.message, "hata");
        }
      };

      window.donemAc = async () => {
        ayarlar.donem_acik = true;
        await setDoc(doc(db, "program_talep_ayarlar", "genel"), {
          ...ayarlar,
          guncelleme: serverTimestamp(),
        });
        await ayarlariYukle();
        adminAyarlarGoster();
      };
      window.donemKapat = async () => {
        ayarlar.donem_acik = false;
        await setDoc(doc(db, "program_talep_ayarlar", "genel"), {
          ...ayarlar,
          guncelleme: serverTimestamp(),
        });
        await ayarlariYukle();
        adminAyarlarGoster();
      };
      window.tumTalepleriSifirla = async () => {
        if (!confirm("Tüm talepler silinecek. Emin misiniz?")) return;
        const snap = await getDocs(collection(db, "program_talep_matris"));
        await Promise.all(snap.docs.map((d) => deleteDoc(d.ref)));
        tumMatrisler = {};
        mesajGoster("sifirMesaj", "Tüm talepler silindi.", "basari");
      };

      function mesajGoster(id, metin, tip) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = metin;
        el.className = "mesaj mesaj-" + tip;
        el.style.display = "block";
        if (tip !== "bilgi")
          setTimeout(() => (el.style.display = "none"), 4000);
      }
    </script>
  </body>
</html>
