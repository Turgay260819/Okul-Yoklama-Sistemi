<!doctype html>
<html lang="tr">
  <head>

    <title>Ders Programı Talep Sistemi</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f4f8;
        color: #1a1d2e;
      }
      .topbar {
        background: #0d47a1;

        padding: 13px 24px;

        justify-content: space-between;

        flex-wrap: wrap;

      }

      }
      .topbar-sag {
        display: flex;

      }
      .btn {

        border-radius: 8px;
        font-size: 13px;

        font-family: inherit;

      }
      .btn-beyaz {
        background: rgba(255, 255, 255, 0.15);

        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .btn-beyaz:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .btn-mavi {
        background: #1a73e8;
        color: white;
      }
      .btn-mavi:hover {
        background: #1557b0;
      }
      .btn-yesil {
        background: #34a853;
        color: white;
      }
      .btn-yesil:hover {
        background: #2d8f47;
      }
      .btn-kirmizi {
        background: #ea4335;
        color: white;
      }
      .btn-kirmizi:hover {
        background: #c5221f;
      }
      .btn-gri {
        background: #666;
        color: white;
      }
      .btn-turuncu {
        background: #f9ab00;
        color: white;
      }
      .btn-sm {
        padding: 5px 12px;
        font-size: 12px;
      }
      .icerik {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .kart {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        margin-bottom: 16px;
      }
      .kart-baslik {
        font-size: 15px;
        font-weight: 700;
        color: #333;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sekme-bar {
        display: flex;
        gap: 4px;
        margin-bottom: 20px;
        background: #f0f4f8;
        border-radius: 10px;
        padding: 4px;
        width: fit-content;
        flex-wrap: wrap;
      }
      .sekme-btn {
        padding: 8px 18px;

        color: #6b7280;
        border: none;

        font-family: inherit;
        transition: all 0.15s;
      }
      .sekme-btn.aktif {
        background: white;
        color: #1a73e8;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }
      .sekme-icerik {
        display: none;
      }
      .sekme-icerik.aktif {
        display: block;
      }
      .rozet {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
      }
      .rozet-yesil {
        background: #e6f4ea;
        color: #1e7e34;
      }
      .rozet-kirmizi {
        background: #fce8e6;
        color: #c5221f;
      }
      .rozet-mavi {
        background: #e8f0fe;
        color: #1a73e8;
      }
      .rozet-sari {
        background: #fef7e0;
        color: #b06000;
      }
      .rozet-gri {
        background: #f1f3f4;
        color: #555;
      }
      .mesaj {
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        margin-top: 10px;
        display: none;
      }
      .mesaj-basari {
        background: #e6f4ea;
        color: #1e7e34;
      }
      .mesaj-hata {
        background: #fce8e6;
        color: #c5221f;
      }
      .mesaj-bilgi {
        background: #e8f0fe;
        color: #1a73e8;
      }
      .yukleniyor {
        text-align: center;
        padding: 60px;
        color: #666;
      }
      .form-group {
        margin-bottom: 14px;
      }
      .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #6b7280;
        margin-bottom: 5px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: #1a73e8;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        background: #f8f9fa;
        padding: 10px 14px;
        text-align: left;
        font-size: 12px;
        font-weight: 700;
        color: #6b7280;
        border-bottom: 2px solid #e0e0e0;
      }
      td {
        padding: 10px 14px;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px;
      }
      tr:last-child td {
        border-bottom: none;
      }

      /* MATRİS */
      .matris-wrap {
        overflow-x: auto;
      }
      .matris {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
      }
      .matris th {
        background: #0d47a1;
        color: white;
        padding: 8px 6px;
        text-align: center;
        font-size: 11px;
      }
      .matris th:first-child {
        min-width: 90px;
        text-align: left;
        padding-left: 10px;
      }
      .matris td {
        border: 1px solid #e0e0e0;
        padding: 0;
        text-align: center;
        height: 44px;
        cursor: pointer;
        transition: background 0.1s;
      }
      .matris td:first-child {
        background: #f8f9fa;
        font-weight: 700;
        font-size: 11px;
        color: #555;
        cursor: default;
        padding: 0 10px;
        text-align: left;
      }
      .hucre-bos {
        background: white;
      }
      .hucre-bos:hover {
        background: #fce8e6;
      }
      .hucre-x {
        background: #fce8e6;
      }
      .hucre-x:hover {
        background: #f5b7b1;
      }
      .matris.salt-okunur td { cursor: default; }
      .matris.salt-okunur .hucre-bos:hover { background: white; }
      .matris.salt-okunur .hucre-x:hover { background: #fce8e6; }
      .hucre-x-ic {
        color: #c5221f;
        font-weight: 800;
        font-size: 16px;
      }

      /* TALEP MATRİSİ: DERS YOK + YERLEŞEBİLİRLİK RENKLERİ */
      .hucre-dersyok {
        background: repeating-linear-gradient(45deg, #e0e0e0, #e0e0e0 6px, #eeeeee 6px, #eeeeee 12px);
      }
      .hucre-dersyok:hover { background: #d5d5d5; }
      .dersyok-ic {
        font-size: 11px;
        font-weight: 800;
        color: #444;
        letter-spacing: 0.3px;
        line-height: 1.1;
      }
      .hucre-katki { box-shadow: inset 0 0 0 3px #d93025; }
      .hucre-katki .dersyok-ic { color: #c5221f; }
      .risk-yesil { background: #e6f4ea; }
      .risk-yesil:hover { background: #ceead6; }
      .risk-sari { background: #fef3c0; }
      .risk-sari:hover { background: #fde68a; }
      .risk-kirmizi { background: #f6b8b3; }
      .risk-kirmizi:hover { background: #f28b82; }
      .hucre-dissi { background: #fafafa; color: #ccc; cursor: default; }
      .risk-not { font-size: 10px; color: #666; font-weight: 700; }
      .mini-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 12px;
      }
      .mini-kart {
        border: 1px solid #e8e8e8;
        border-radius: 8px;
        padding: 10px;
        background: white;
      }
      .mini-kart-baslik {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      table.mini-matris { width: 100%; border-collapse: collapse; margin: 0; table-layout: fixed; }
      table.mini-matris th, table.mini-matris td {
        border: 1px solid #eee;
        padding: 0;
        height: 22px;
        font-size: 9px;
        text-align: center;
      }
      table.mini-matris th { background: #f8f9fa; font-weight: 600; }
      table.mini-matris td:first-child, table.mini-matris th:first-child { width: 30px; }
      table.mini-matris .dersyok-ic { font-size: 7px; }

      /* Gün adı = tüm günü kapat/aç kısayolu */
      .matris td.gun-hucre { cursor: pointer; white-space: nowrap; }
      .matris td.gun-hucre:hover { background: #e8eaed; }
      .gun-ikon { font-size: 10px; opacity: 0.6; }
      .matris .kisa { display: none; }
      .hizli-dugmeler { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
      .yatay-btn { display: none; }

      /* Telefon (dik): 9 sütun yatay kaydırmasız sığsın */
      @media (max-width: 600px) {
        .matris .uzun { display: none; }
        .matris .kisa { display: inline; }
        .matris th { padding: 6px 1px; font-size: 11px; }
        .matris th:first-child { min-width: 0; width: 46px; padding-left: 4px; }
        .matris td { height: 40px; }
        .matris td:first-child { padding: 0 3px; font-size: 11px; }
        .gun-ikon { display: block; font-size: 9px; }
        .dersyok-ic { font-size: 8px; letter-spacing: 0; word-spacing: 100px; }
        .risk-not { font-size: 9px; }
        .hizli-dugmeler .btn { flex: 1 1 100%; }
        .yatay-btn { display: inline-block; }
        .kart { padding: 12px 8px; }
      }

      /* ISI HARİTASI RENKLERİ */
      .isi-0 {
        background: #e8f5e9;
      }
      .isi-1 {
        background: #c8e6c9;
      }
      .isi-2 {
        background: #fff9c4;
      }
      .isi-3 {
        background: #ffe0b2;
      }
      .isi-4 {
        background: #ffccbc;
      }
      .isi-5 {
        background: #ffcdd2;
      }
      .isi-6 {
        background: #ef9a9a;
      }

      .uyum-bar {
        height: 16px;
        border-radius: 8px;
        background: #e0e0e0;
        overflow: hidden;
        margin-top: 6px;
      }
      .uyum-dolgu {
        height: 100%;
        border-radius: 8px;
        transition: width 0.3s;
      }

      .acmaz-uyari {
        background: #fce8e6;
        border: 1px solid #f5c6c6;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 13px;
        color: #c5221f;
        margin-bottom: 12px;
      }
      .acmaz-uyari strong {
        display: block;
        margin-bottom: 4px;
      }

      .isi-legend {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 11px;
        margin-bottom: 12px;
      }
      .isi-legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .isi-legend-renk {
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }

      @media (max-width: 768px) {
        .icerik {
          padding: 12px;
        }
        .talep-izgara {
          grid-template-columns: minmax(0, 1fr) !important;
        }
      }
    </style>
    <script>if(new URLSearchParams(location.search).get("embedded"))document.addEventListener("DOMContentLoaded",()=>{document.querySelector("h1")?.remove();const tb=document.querySelector(".topbar");if(tb){const b=document.createElement("button");b.className="btn btn-beyaz";b.style.cssText="padding:6px 14px;font-size:13px;margin-left:auto;";b.textContent="← Menüye Dön";b.onclick=()=>{try{window.parent.ogretmenGeri();}catch(e){}};tb.appendChild(b);}});</script>
    <script src="/js/salt-okunur.js"></script>
  </head>
  <body>
    <div class="topbar">
      <h1>📐 Ders Programı Talep Sistemi</h1>
      <div class="topbar-sag">
        <span id="donemRozet" class="rozet rozet-kirmizi">Talep Kapalı</span>
      </div>
    </div>

    <div class="icerik">
      <div id="yukleniyor" class="yukleniyor">Yükleniyor...</div>
      <div id="anaIcerik" style="display: none"></div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        collection,
        query,
        where,
        serverTimestamp,
        onSnapshot,
        writeBatch,
        Timestamp,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAHTCiicd4b94rG1-jN0STRbwcrLmkYudo",
        authDomain: "okul-yoklama-sistemi-8081f.firebaseapp.com",
        projectId: "okul-yoklama-sistemi-8081f",
        storageBucket: "okul-yoklama-sistemi-8081f.firebasestorage.app",
        messagingSenderId: "38230047763",
        appId: "1:38230047763:web:dfab058df8928b66be13e6",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const GUNLER = ["Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma"];
      const DERSLER = [1, 2, 3, 4, 5, 6, 7, 8];

      let aktifKullanici = null;
      let aktifRol = null;
      let aktifOgretmenId = null;
      let aktifOgretmenAdi = null;
      let ayarlar = { donem_acik: false };
      let tumTanimlar = [];
      let tumSiniflar = [];
      let tumDersListesi = [];
      let tumOgretmenler = [];
      let subeToplam = {};
      let tumMatrisler = {};
      let benimMatris = {};
      let programSeciliOgretmenId = null;
      let programOgretmenSchedule = {};

      // Yüklü programdan (schedule) türetilen yük verisi
      let sinifSlotlari = {}; // { "6A": Set("Pazartesi-1", ...) }
      let sinifBirimleri = {}; // { "6A": [{ ogretmenler: [id,...], saat }] }
      let ogretmenYuk = {}; // { ogretmenId: { "6A": { saat, dersler:Set } } }
      let tumGerekceler = {}; // { ogretmenId: "saglik" | "cocuk_bakimi" | "ulasim" | "" }
      let benimGerekce = "";
      let kaydedilmemis = false;
      let kayitZamanlayici = null;

      // Isı haritası eşikleri (sarı = yerleşir ama sıkışık)
      const SARI_ADAY_ESIGI = 2; // o saatte sınıfa girebilecek öğretmen sayısı bu kadar veya azsa
      const SARI_KAPASITE_ESIGI = 2; // öğretmenin açık bıraktığı saat − yükü bu kadar veya azsa

      const GUN_GORUNEN = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma"];
      const GUN_KISA = ["Pzt", "Sal", "Çar", "Per", "Cum"];

      const GEREKCELER = [
        { kod: "saglik", ad: "Sağlık" },
        { kod: "cocuk_bakimi", ad: "Çocuk bakımı" },
        { kod: "ulasim", ad: "Ulaşım" },
      ];
      function gerekceAdi(kod) {
        return GEREKCELER.find((g) => g.kod === kod)?.ad || "";
      }

      // schedule.day yazımı import kaynağına göre aksanlı/aksansız olabilir;
      // functions/index.js ve portal-utils.js'teki normalizeGun ile aynı mantık.
      function normalizeGunLocal(gun) {
        return String(gun || "")
          .trim()
          .toLocaleLowerCase("tr")
          .replace(/ı/g, "i")
          .replace(/ş/g, "s")
          .replace(/ç/g, "c")
          .replace(/ğ/g, "g")
          .replace(/ü/g, "u")
          .replace(/ö/g, "o");
      }

      // Matris key: "Pzt-1", "Sal-3" vs
      function matrisKey(gi, di) {
        return GUNLER[gi] + "-" + DERSLER[di];
      }

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "/portal.html";
          return;
        }
        const ud = await getDoc(doc(db, "users", user.uid));
        if (!ud.exists()) {
          window.location.href = "/portal.html";
          return;
        }
        aktifKullanici = ud.data();
        aktifRol = aktifKullanici.rol;

        if (aktifRol === "ogretmen") {
          const ogSnap = await getDocs(
            query(collection(db, "teachers"), where("uid", "==", user.uid)),
          );
          if (!ogSnap.empty) {
            aktifOgretmenId = ogSnap.docs[0].id;
            aktifOgretmenAdi = ogSnap.docs[0].data().ad || "";
          }
        } else if (aktifRol === "admin" || aktifRol === "mudur_yardimcisi" || aktifRol === "idareci_izleyici") {
          const tumOgSnap = await getDocs(collection(db, "teachers"));
          tumOgretmenler = [];
          tumOgSnap.forEach((d) => tumOgretmenler.push({ id: d.id, ...d.data() }));
          tumOgretmenler.sort((a, b) => (a.ad || "").localeCompare(b.ad || "", "tr"));
        }

        const sinifSnap = await getDocs(collection(db, "classes"));
        tumSiniflar = [];
        sinifSnap.forEach((d) => tumSiniflar.push({ id: d.id, ...d.data() }));
        tumSiniflar.sort((a, b) => (a.class_name || "").localeCompare(b.class_name || "", "tr"));

        await ayarlariYukle();
        await tanimlariYukle();
        await dersListesiniYukle();
        await programYukVerisiYukle();
        await tumMatrisleriYukle();

        document.getElementById("yukleniyor").style.display = "none";
        document.getElementById("anaIcerik").style.display = "block";

        if (aktifRol === "admin" || aktifRol === "mudur_yardimcisi" || aktifRol === "idareci_izleyici") {
          adminSayfasi();
        } else {
          ogretmenSayfasi();
        }
      });

      async function ayarlariYukle() {
        const snap = await getDoc(doc(db, "program_talep_ayarlar", "genel"));
        if (snap.exists()) ayarlar = snap.data();
        const r = document.getElementById("donemRozet");
        if (talepAktif()) {
          r.textContent = "Talep Dönemi Açık";
          r.className = "rozet rozet-yesil";
        } else {
          r.textContent = ayarlar.donem_acik ? "Talep Süresi Doldu" : "Talep Kapalı";
          r.className = "rozet rozet-kirmizi";
        }
      }

      // ── TALEP SÜRESİ ──
      // ayarlar.son_tarih "YYYY-MM-DD", ayarlar.son_zaman o günün 23:59:59 (TR) Timestamp'i
      function talepSonZaman() {
        const z = ayarlar.son_zaman;
        if (z?.toDate) return z.toDate();
        if (ayarlar.son_tarih) return new Date(ayarlar.son_tarih + "T23:59:59+03:00");
        return null;
      }

      function talepAktif() {
        if (!ayarlar.donem_acik) return false;
        const son = talepSonZaman();
        return !son || Date.now() <= son.getTime();
      }

      function tarihTR(ymd) {
        const [y, a, g] = String(ymd || "").split("-");
        return g && a && y ? `${g}.${a}.${y}` : "";
      }

      function kalanGunMetni() {
        const son = talepSonZaman();
        if (!son) return "";
        const bugunBas = new Date(new Date().toLocaleDateString("en-CA", { timeZone: "Europe/Istanbul" }) + "T00:00:00+03:00");
        const sonBas = new Date(ayarlar.son_tarih + "T00:00:00+03:00");
        const gun = Math.round((sonBas - bugunBas) / 86400000);
        return gun <= 0 ? "bugün son gün" : gun + " gün kaldı";
      }

      // Öğretmen bir değişiklik yapmadan önce: süre dolduysa salt okunur görünüme geç
      function talepYazilabilir() {
        if (talepAktif()) return true;
        clearTimeout(kayitZamanlayici);
        kaydedilmemis = false;
        alert("Program talebi süresi sona erdi. Talebinizde artık değişiklik yapılamaz.");
        ogretmenSayfasi();
        return false;
      }

      async function tanimlariYukle() {
        const snap = await getDocs(collection(db, "program_talep_tanimlar"));
        tumTanimlar = [];
        snap.forEach((d) => tumTanimlar.push({ id: d.id, ...d.data() }));
      }

      async function dersListesiniYukle() {
        const snap = await getDocs(collection(db, "ders_listesi"));
        tumDersListesi = [];
        snap.forEach((d) => tumDersListesi.push({ id: d.id, ...d.data() }));
        tumDersListesi.sort((a, b) => (a.ders_adi || "").localeCompare(b.ders_adi || "", "tr"));
      }

      // Talepleri canlı dinler: başka öğretmen kaydettiğinde renkler anında güncellenir.
      function tumMatrisleriYukle() {
        return new Promise((resolve) => {
          let ilk = true;
          onSnapshot(
            collection(db, "program_talep_matris"),
            (snap) => {
              snap.docChanges().forEach((ch) => {
                const id = ch.doc.id;
                if (ch.type === "removed") {
                  delete tumMatrisler[id];
                  delete tumGerekceler[id];
                  return;
                }
                const d = ch.doc.data();
                tumMatrisler[id] = d.matris || {};
                tumGerekceler[id] = d.gerekce || "";
                if (id === aktifOgretmenId && !kaydedilmemis && !ch.doc.metadata.hasPendingWrites) {
                  benimMatris = { ...tumMatrisler[id] };
                  benimGerekce = tumGerekceler[id];
                }
              });
              if (ilk) {
                ilk = false;
                resolve();
              } else {
                canliYenile();
              }
            },
            (err) => {
              console.error("Talep dinleme hatası:", err);
              if (ilk) {
                ilk = false;
                resolve();
              }
            },
          );
        });
      }

      function canliYenile() {
        if (document.getElementById("benimMatris")) matrisGuncelle();
        if (document.getElementById("asekme-isi")?.classList.contains("aktif")) adminIsiIcerikCiz();
        if (document.getElementById("asekme-acmaz")?.classList.contains("aktif")) adminAcmazGoster();
      }

      // ── YÜKLÜ PROGRAMDAN YÜK VERİSİ ──
      // schedule: { day, lesson_number, class_id, teacher_id, lesson_name }
      async function programYukVerisiYukle() {
        const snap = await getDocs(collection(db, "schedule"));
        const gunIndeks = {};
        GUNLER.forEach((g, gi) => (gunIndeks[normalizeGunLocal(g)] = gi));

        // sinif -> slot -> Set(ogretmen)
        const sinifSlotOgretmen = {};
        sinifSlotlari = {};
        ogretmenYuk = {};
        snap.forEach((d) => {
          const k = d.data();
          const gi = gunIndeks[normalizeGunLocal(k.day)];
          const di = DERSLER.indexOf(Number(k.lesson_number));
          const sinif = (k.class_id || "").trim();
          if (gi === undefined || di < 0 || !sinif || !k.teacher_id) return;
          const key = matrisKey(gi, di);
          (sinifSlotlari[sinif] ||= new Set()).add(key);
          const slotlar = (sinifSlotOgretmen[sinif] ||= {});
          (slotlar[key] ||= new Set()).add(k.teacher_id);
          const oy = ((ogretmenYuk[k.teacher_id] ||= {})[sinif] ||= { saat: 0, dersler: new Set(), slotlar: new Set() });
          if (!oy.slotlar.has(key)) {
            oy.slotlar.add(key);
            oy.saat++;
          }
          if (k.lesson_name) oy.dersler.add(k.lesson_name);
        });

        // Aynı slotta aynı sınıfa giren öğretmenler (grup dersi) tek birim sayılır.
        sinifBirimleri = {};
        Object.entries(sinifSlotOgretmen).forEach(([sinif, slotlar]) => {
          const birimler = {};
          Object.values(slotlar).forEach((ogrSet) => {
            const ids = [...ogrSet].sort();
            const bk = ids.join("|");
            (birimler[bk] ||= { ogretmenler: ids, saat: 0 }).saat++;
          });
          sinifBirimleri[sinif] = Object.values(birimler);
        });
      }

      function ogretmenSiniflari(id) {
        return Object.keys(ogretmenYuk[id] || {}).sort((a, b) => a.localeCompare(b, "tr", { numeric: true }));
      }

      function ogretmenToplamYuk(id) {
        return Object.values(ogretmenYuk[id] || {}).reduce((s, x) => s + x.saat, 0);
      }

      // ── YERLEŞEBİLİRLİK MOTORU ──
      // matrisAl(id) -> o öğretmenin kapalı saatleri { key: true }
      function guncelMatrisAl(id) {
        return id === aktifOgretmenId ? benimMatris : tumMatrisler[id] || {};
      }

      // Sınıf için maksimum eşleştirme: birim-saatleri ↔ sınıfın ders saatleri.
      // Eşleşen < toplam ise bu taleplerle sınıfın programı kesin yerleşemez.
      function sinifEslesme(sinif, matrisAl = guncelMatrisAl) {
        const slotlar = [...(sinifSlotlari[sinif] || [])];
        const birimler = sinifBirimleri[sinif] || [];
        const uygun = birimler.map((b) => {
          const ms = b.ogretmenler.map(matrisAl);
          const liste = [];
          slotlar.forEach((s, si) => {
            if (ms.every((m) => !m[s])) liste.push(si);
          });
          return liste;
        });
        // Sol düğümler: her birim saat kadar kopyalanır
        const sol = [];
        birimler.forEach((b, bi) => {
          for (let i = 0; i < b.saat; i++) sol.push(bi);
        });
        const sagEs = new Array(slotlar.length).fill(-1);
        function dene(u, gorulen) {
          for (const si of uygun[sol[u]]) {
            if (gorulen[si]) continue;
            gorulen[si] = true;
            if (sagEs[si] === -1 || dene(sagEs[si], gorulen)) {
              sagEs[si] = u;
              return true;
            }
          }
          return false;
        }
        let eslesen = 0;
        for (let u = 0; u < sol.length; u++) {
          if (dene(u, new Array(slotlar.length).fill(false))) eslesen++;
        }
        // Aday: her ders saatinde o sınıfa girebilecek (o saati kapatmamış) birim sayısı
        const aday = {};
        slotlar.forEach((s) => (aday[s] = 0));
        uygun.forEach((l) => l.forEach((si) => aday[slotlar[si]]++));
        const toplam = sol.length;
        return { toplam, eslesen, eksik: toplam - eslesen, aday };
      }

      // Öğretmenin kendi kapasitesi: sınıflarının ders saatleri içinde açık bıraktığı saat − yükü
      function ogretmenKapasite(id, matris = guncelMatrisAl(id)) {
        const birlesim = new Set();
        ogretmenSiniflari(id).forEach((s) => (sinifSlotlari[s] || []).forEach((k) => birlesim.add(k)));
        let acik = 0;
        birlesim.forEach((k) => {
          if (!matris[k]) acik++;
        });
        return acik - ogretmenToplamYuk(id);
      }

      function bolunmeAcmazVar(id, matris) {
        return tumTanimlar
          .filter((t) => t.ogretmen_id === id && t.bolunme)
          .some((t) => {
            const parca = bolunmedenParcaSayisi(t.bolunme);
            let musaitGun = 0;
            for (let gi = 0; gi < 5; gi++) {
              for (let di = 0; di < 8; di++) {
                const k = matrisKey(gi, di);
                if ((sinifSlotlari[t.sube]?.has(k) ?? true) && !matris[k]) {
                  musaitGun++;
                  break;
                }
              }
            }
            return musaitGun < parca;
          });
      }

      // Öğretmenin tüm durumunu değerlendirir (verilen matrisle).
      function ogretmenDurum(id, matris) {
        const matrisAl = (oid) => (oid === id ? matris : guncelMatrisAl(oid));
        const siniflar = {};
        ogretmenSiniflari(id).forEach((s) => (siniflar[s] = sinifEslesme(s, matrisAl)));
        return {
          siniflar,
          kapasite: ogretmenKapasite(id, matris),
          bolunme: bolunmeAcmazVar(id, matris),
        };
      }

      function durumAcmaz(d) {
        return d.kapasite < 0 || d.bolunme || Object.values(d.siniflar).some((x) => x.eksik > 0);
      }

      // Açık bir hücre kapatılırsa ne olur? -> { seviye: "yesil"|"sari"|"kirmizi", neden }
      function hucreRiski(id, gi, di, mevcutDurum) {
        const key = matrisKey(gi, di);
        const matris = guncelMatrisAl(id);
        const yeni = ogretmenDurum(id, { ...matris, [key]: true });
        const nedenler = [];
        Object.entries(yeni.siniflar).forEach(([s, x]) => {
          const once = mevcutDurum.siniflar[s];
          if (x.eksik > 0 && x.eksik > (once?.eksik || 0))
            nedenler.push(`${s} sınıfının programı yerleşemez (eksik ${x.eksik} saat)`);
        });
        if (yeni.kapasite < 0 && yeni.kapasite < mevcutDurum.kapasite)
          nedenler.push(`kendi ${ogretmenToplamYuk(id)} saatlik dersiniz sığmaz`);
        if (yeni.bolunme && !mevcutDurum.bolunme) nedenler.push("dersin bölünmesi için yeterli gün kalmaz");
        if (nedenler.length) return { seviye: "kirmizi", neden: "Bu saati kapatırsanız " + nedenler.join("; ") + "." };

        const sari = [];
        Object.entries(yeni.siniflar).forEach(([s, x]) => {
          if (key in x.aday && x.aday[key] <= SARI_ADAY_ESIGI)
            sari.push(`${s} sınıfına bu saatte girebilecek ${x.aday[key]} öğretmen kalır`);
        });
        if (yeni.kapasite <= SARI_KAPASITE_ESIGI)
          sari.push(`kendi programınızda yalnızca ${Math.max(0, yeni.kapasite)} saat esneklik kalır`);
        if (sari.length) return { seviye: "sari", neden: "Yerleşir ama sıkışık: " + sari.join("; ") + "." };
        return { seviye: "yesil", neden: "Rahat: bu saati kapatmak programı zorlamaz." };
      }

      // Açmazdaki bir öğretmenin hangi kapalı hücreleri açmaza katkı veriyor?
      function katkiHucreleri(id) {
        const matris = guncelMatrisAl(id);
        const durum = ogretmenDurum(id, matris);
        const sonuc = new Set();
        if (!durumAcmaz(durum)) return sonuc;
        const acmazSinif = Object.keys(durum.siniflar).filter((s) => durum.siniflar[s].eksik > 0);
        Object.keys(matris).forEach((k) => {
          if (!matris[k]) return;
          const acilmis = { ...matris };
          delete acilmis[k];
          const matrisAl = (oid) => (oid === id ? acilmis : guncelMatrisAl(oid));
          const iyilesir =
            acmazSinif.some((s) => sinifEslesme(s, matrisAl).eksik < durum.siniflar[s].eksik) ||
            (durum.kapasite < 0 && ogretmenKapasite(id, acilmis) > durum.kapasite) ||
            (durum.bolunme && !bolunmeAcmazVar(id, acilmis));
          if (iyilesir) sonuc.add(k);
        });
        return sonuc;
      }

      // Bir öğretmenin herhangi bir sınıfına girilen saat mi? (değilse risk hesaplanmaz)
      function ogretmenSlotIlgili(id, key) {
        return ogretmenSiniflari(id).some((s) => sinifSlotlari[s]?.has(key));
      }

      // Salt okunur mini/normal matris (admin görünümleri)
      function talepMatrisHtml(id, mini) {
        const matris = tumMatrisler[id] || {};
        const katki = katkiHucreleri(id);
        let html = `<table class="${mini ? "mini-matris" : "matris salt-okunur"}"><thead><tr><th>${mini ? "" : "Gün \\ Ders"}</th>`;
        DERSLER.forEach((d) => (html += `<th>${mini ? d : d + ". Ders"}</th>`));
        html += "</tr></thead><tbody>";
        GUNLER.forEach((g, gi) => {
          html += `<tr><td>${mini ? g.slice(0, 3) : g}</td>`;
          DERSLER.forEach((d, di) => {
            const k = matrisKey(gi, di);
            if (matris[k]) {
              const kt = katki.has(k);
              html += `<td class="hucre-dersyok${kt ? " hucre-katki" : ""}" title="${kt ? "Bu talep sınıf programını açmaza sokuyor" : "Ders yok talebi"}"><div class="dersyok-ic">${kt ? "⚠ " : ""}DERS YOK</div></td>`;
            } else if (!ogretmenSlotIlgili(id, k)) {
              html += `<td class="hucre-dissi"></td>`;
            } else {
              html += `<td class="hucre-bos"></td>`;
            }
          });
          html += "</tr>";
        });
        return html + "</tbody></table>";
      }

      function ogretmenAdi(id) {
        return tumOgretmenler.find((o) => o.id === id)?.ad || tumTanimlar.find((t) => t.ogretmen_id === id)?.ogretmen_adi || "(bilinmiyor)";
      }

      // ── BÖLÜNME ANALİZİ ──
      function bolunmedenParcaSayisi(bolunme) {
        if (!bolunme) return 1;
        return bolunme.toString().split("+").length;
      }

      // Isı yoğunluğu: o gün/saatte kaç öğretmen X koymuş
      function isiYogunluk(gi, di) {
        const key = matrisKey(gi, di);
        let sayi = 0;
        Object.entries(tumMatrisler).forEach(([id, m]) => {
          if (id === aktifOgretmenId) return; // benimMatris güncel sürümü aşağıda sayılıyor
          if (m[key]) sayi++;
        });
        if (benimMatris[key]) sayi++;
        return sayi;
      }

      // ── ÖĞRETMEN SAYFASI ──
      function ogretmenSayfasi() {
        benimMatris = tumMatrisler[aktifOgretmenId]
          ? { ...tumMatrisler[aktifOgretmenId] }
          : {};
        benimGerekce = tumGerekceler[aktifOgretmenId] || "";
        if (talepAktif()) {
          // Talep süresince yalnızca istek matrisi
          document.getElementById("anaIcerik").innerHTML = `<div class="sekme-icerik aktif" id="osekme-talep"></div>`;
        } else {
          // Süre dolunca (veya dönem kapalıyken) diğer menüler de görünür
          document.getElementById("anaIcerik").innerHTML = `
            <div class="sekme-bar">
              <button class="sekme-btn aktif" onclick="ogretmenSekme('talep', this)">📐 Program Talebim</button>
              <button class="sekme-btn" onclick="ogretmenSekme('dersler', this)">📚 Derslerim</button>
              <button class="sekme-btn" onclick="ogretmenSekme('program', this)">📅 Ders Programım</button>
            </div>
            <div class="sekme-icerik aktif" id="osekme-talep"></div>
            <div class="sekme-icerik" id="osekme-dersler"></div>
            <div class="sekme-icerik" id="osekme-program"></div>`;
        }
        ogretmenTalepGoster();
      }

      window.ogretmenSekme = (id, el) => {
        document.querySelectorAll(".sekme-btn").forEach((b) => b.classList.remove("aktif"));
        document.querySelectorAll(".sekme-icerik").forEach((s) => s.classList.remove("aktif"));
        el.classList.add("aktif");
        document.getElementById("osekme-" + id).classList.add("aktif");
        if (id === "dersler") ogretmenDerslerGoster();
        else if (id === "talep") ogretmenTalepGoster();
        else if (id === "program") ogretmenProgramGoster();
      };

      // Öğretmenin kendi ders programı — admin'deki 5x8 tablonun salt okunur hali
      async function ogretmenProgramGoster() {
        const c = document.getElementById("osekme-program");
        if (!aktifOgretmenId) {
          c.innerHTML = `<div class="kart"><div class="bos-mesaj">Öğretmen kaydınız bulunamadı.</div></div>`;

          <div id="ogretmenProgramAlani"><div class="yukleniyor">Yükleniyor...</div></div>
        </div>`;
        try {

            Object.keys(programOgretmenSchedule).length + " ders saati / hafta";

        const c = document.getElementById("osekme-dersler");
        const siniflar = ogretmenSiniflari(aktifOgretmenId);

        let html = `<div class="kart">

              })
              .join("")}
            </tbody></table>`;
        } else {
          html += `<div class="bos-mesaj">Yüklü ders programında size ait ders bulunamadı.</div>`;

        html += `</div>`;
