    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import {
        getFunctions,
        httpsCallable,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        getDocs,
        collection,
        query,
        where,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAHTCiicd4b94rG1-jN0STRbwcrLmkYudo",
        authDomain: "okul-yoklama-sistemi-8081f.firebaseapp.com",
        projectId: "okul-yoklama-sistemi-8081f",
        storageBucket: "okul-yoklama-sistemi-8081f.firebasestorage.app",
        messagingSenderId: "38230047763",
        appId: "1:38230047763:web:dfab058df8928b66be13e6",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const functions = getFunctions(app, "us-central1");

      const GUNLER = ["Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma"];
      const VARSAYILAN_NOKTALAR = [
        "On Bahce Dis Kapi",
        "On Bahce Hali Saha Kapisi",
        "On Bahce Okul Girisi",
        "Arka Bahce Dis Kapi",
        "Arka Bahce Okul Girisi",
        "Zemin Kat Sag",
        "Zemin Kat Sol",
        "1. Kat Sag",
        "1. Kat Sol",
        "2. Kat Sag",
        "2. Kat Sol",
      ];

      let NOKTALAR = [];
      let ogretmenler = [];
      let nobetVerisi = null;
      let editSlotlar = [];
      let seciliOgr = null;
      let OKUL_BASLANGIC = "";
      let OKUL_BITIS = "";
      let TATILLER = [];

      function gunTatilMi(tarihStr) {
        const t = TATILLER.find(
          (x) => x.baslangic && x.bitis && tarihStr >= x.baslangic && tarihStr <= x.bitis,
        );
        return t ? t.ad : null;
      }
      function haftaTamamenTatilMi(haftaBasStr) {
        for (let gi = 0; gi < 5; gi++) {
          const d = new Date(haftaBasStr + "T12:00:00");
          d.setDate(d.getDate() + gi);
          if (!gunTatilMi(d.toISOString().split("T")[0])) return false;
        }
        return true;
      }
      function haftaTarihEkle(tarihStr, gun) {
        const d = new Date(tarihStr + "T12:00:00");
        d.setDate(d.getDate() + gun);
        return d.toISOString().split("T")[0];
      }

      function N() {
        return NOKTALAR.length;
      }
      function TOPLAM() {
        return 5 * N();
      }
      function slotToPos(slot) {
        return { gi: Math.floor(slot / N()), ni: slot % N() };
      }
      function posToSlot(gi, ni) {
        return gi * N() + ni;
      }

      // Bir güne sabitlenmiş (sabit_gun) öğretmenlerin o gün içinde dönebileceği
      // nokta havuzu: o güne ait, sgn tarafından işgal edilmemiş tüm noktalar.
      function sabitGunNoktaHavuzu(gi, slotlar) {
        const sgnNoktalari = new Set();
        (slotlar || []).forEach((t) => {
          if (t.sabitlik === "sgn" && slotToPos(t.baslangic_slot).gi === gi)
            sgnNoktalari.add(slotToPos(t.baslangic_slot).ni);
        });
        const havuz = [];
        for (let ni = 0; ni < N(); ni++) if (!sgnNoktalari.has(ni)) havuz.push(ni);
        return havuz;
      }

      // "sabit_gun" öğretmenlerinin bu haftaki (sayac'a göre) gerçek pozisyonu.
      function sabitGunPozisyonu(s, sayac, slotlar) {
        const gi = slotToPos(s.baslangic_slot).gi;
        const havuz = sabitGunNoktaHavuzu(gi, slotlar);
        if (!havuz.length) return slotToPos(s.baslangic_slot);
        const basNi = slotToPos(s.baslangic_slot).ni;
        const basIdx = havuz.indexOf(basNi);
        const idx = basIdx < 0 ? 0 : basIdx;
        const yeniIdx = (((idx + sayac) % havuz.length) + havuz.length) % havuz.length;
        return { gi, ni: havuz[yeniIdx] };
      }

      // Serbest rotasyon havuzu: sgn slotları her zaman, sabit_gun slotları ise
      // sadece o haftaki gerçekte dolu (gün,nokta) pozisyonu kadar çıkarılır —
      // bir günün tamamı değil, sadece o an dolu olan nokta havuzdan düşürülür.
      function serbestSlotListesi(slotlar, sayac) {
        const sgn = new Set();
        const doluSabitGun = new Set();
        (slotlar || []).forEach((s) => {
          if (s.sabitlik === "sgn") sgn.add(s.baslangic_slot);
          else if (s.sabitlik === "sabit_gun") {
            const pos = sabitGunPozisyonu(s, sayac, slotlar);
            doluSabitGun.add(posToSlot(pos.gi, pos.ni));
          }
        });
        const liste = [];
        for (let adim = 0; adim < TOPLAM(); adim++) {
          const gi = adim % 5;
          const ni = adim % N();
          const slot = posToSlot(gi, ni);
          if (!sgn.has(slot) && !doluSabitGun.has(slot) && !liste.includes(slot)) liste.push(slot);
        }
        return liste;
      }

      // Pozisyon hesapla
      function pozHesapla(s, sayac, slotlar) {
        if (s.sabitlik === "sgn") return slotToPos(s.baslangic_slot);
        if (s.sabitlik === "sabit_gun") return sabitGunPozisyonu(s, sayac, slotlar);
        // Serbest: serbest slot listesinde ilerle
        const serbest = serbestSlotListesi(slotlar, sayac);
        if (!serbest.length) return slotToPos(s.baslangic_slot);
        let idx = serbest.indexOf(s.baslangic_slot);
        if (idx < 0) {
          // Orijinal slot bu hafta bir sabit_gun öğretmeni tarafından dolu —
          // tüm yetim öğretmenlerin 0'a çakışmaması için, orijinal slot
          // numarasından sonraki ilk boş slota (döngüsel) yerleşir.
          idx = serbest.findIndex((slotNo) => slotNo >= s.baslangic_slot);
          if (idx < 0) idx = 0;
        }
        const yeniIdx =
          (((idx + sayac) % serbest.length) + serbest.length) % serbest.length;
        return slotToPos(serbest[yeniIdx]);
      }

      // Verilen tarihin ait olduğu haftanın Pazartesi'sini döner.
      function pazartesiyeYuvarla(bugun) {
        const fark = bugun.getDay() === 0 ? -6 : 1 - bugun.getDay();
        const pzt = new Date(bugun);
        pzt.setDate(bugun.getDate() + fark);
        return pzt;
      }

      // Öğretmenin salt-okunur "Gün Değişme Nöbeti" görünümü — admin init()'in
      // aksine hiçbir doküman oluşturmaz/yazmaz (öğretmenin nobet2_ayarlar'a
      // yazma izni yok), sadece okur. Mevcut pozHesapla/slotToPos/N()
      // fonksiyonlarını doğrudan kullanır (ayrı bir kopya tutulmuyor).
      async function ogretmenGorunumuYukle(teacherId) {
        const icerik = document.getElementById("gdnIcerik");
        document.getElementById("yukleniyor").style.display = "none";
        document.getElementById("ogretmenIcerik").style.display = "block";
        try {
          const [nbDoc, nokDoc, ayarDoc, tatilSnap] = await Promise.all([
            getDoc(doc(db, "nobet2_ayarlar", "mevcut")),
            getDoc(doc(db, "nobet2_ayarlar", "noktalar")),
            getDoc(doc(db, "settings", "genel")),
            getDocs(collection(db, "tatil_donemleri")),
          ]);
          OKUL_BASLANGIC = ayarDoc.exists() ? ayarDoc.data().okul_baslangic_tarihi || "" : "";
          OKUL_BITIS = ayarDoc.exists() ? ayarDoc.data().okul_bitis_tarihi || "" : "";
          TATILLER = [];
          tatilSnap.forEach((d) => TATILLER.push(d.data()));

          if (!nbDoc.exists()) {
            icerik.innerHTML = '<div style="color:#888;padding:12px;">Gün değişme nöbeti henüz tanımlanmamış.</div>';
            return;
          }

          const nb = nbDoc.data();
          NOKTALAR = nokDoc.exists() ? (nokDoc.data().liste || []) : [];
          const slotlar = nb.slotlar || [];

          if (!NOKTALAR.length) {
            icerik.innerHTML = '<div style="color:#888;padding:12px;">Nöbet noktaları tanımlanmamış.</div>';
            return;
          }

          const teacherSlot = teacherId ? slotlar.find((s) => s.ogretmen_id === teacherId) : null;
          if (!teacherSlot) {
            icerik.innerHTML = '<div style="color:#888;padding:12px;">Gün değişme nöbet programında kaydınız bulunmuyor.</div>';
            return;
          }

          const GUNLER2 = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma"];
          const GOSTERILECEK_HAFTA_SAYISI = 26;
          const rotasyonAktif = nb.rotasyon_aktif !== false;
          const baseSayac = nb.rotasyon_sayaci || 0;
          const fmt = (d) => d.toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric" });
          const fmt2 = (d) => d.toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit" });
          const today = new Date();
          today.setHours(0, 0, 0, 0);

          let html = `<table>
            <thead><tr>
              <th>Hafta</th>
              <th>Nöbet Günü</th>
              <th>Tarih</th>
              <th>Nöbet Noktası</th>
            </tr></thead><tbody>`;

          let haftaStr = nb.hafta_baslangic;
          let sayac = baseSayac;
          let rowsShown = 0;
          let iter = 0;

          while (rowsShown < GOSTERILECEK_HAFTA_SAYISI && iter < 520) {
            iter++;
            if (OKUL_BITIS && haftaStr > OKUL_BITIS) break;

            const hafta = new Date(haftaStr + "T12:00:00");
            const haftaBitis = new Date(hafta);
            haftaBitis.setDate(hafta.getDate() + 4);
            const haftaBasKarsi = new Date(hafta);
            haftaBasKarsi.setHours(0, 0, 0, 0);
            const haftaBitKarsi = new Date(haftaBitis);
            haftaBitKarsi.setHours(0, 0, 0, 0);
            const buHafta = haftaBasKarsi <= today && today <= haftaBitKarsi;
            const gecti = haftaBitKarsi < today;
            const sinif = buHafta ? "gdn-buHafta" : gecti ? "gdn-gecti" : "";

            const tamTatil = haftaTamamenTatilMi(haftaStr);
            const pos = pozHesapla(teacherSlot, sayac, slotlar);
            const gunTarihiStr = haftaTarihEkle(haftaStr, pos.gi);
            const gunTatilAdi = !tamTatil ? gunTatilMi(gunTarihiStr) : null;

            if (tamTatil || gunTatilAdi) {
              html += `<tr class="${sinif}">
                <td>${fmt2(hafta)} – ${fmt2(haftaBitis)}</td>
                <td colspan="3" style="color:#888;">Tatil</td>
              </tr>`;
            } else {
              const gunTarihi = new Date(gunTarihiStr + "T12:00:00");
              html += `<tr class="${sinif}">
                <td>${fmt2(hafta)} – ${fmt2(haftaBitis)}</td>
                <td><strong>${GUNLER2[pos.gi] || ""}</strong></td>
                <td>${fmt(gunTarihi)}</td>
                <td style="color:#1557b0; font-weight:700;">${NOKTALAR[pos.ni] || ""}</td>
              </tr>`;
            }

            rowsShown++;
            const sonrakiHaftaStr = haftaTarihEkle(haftaStr, 7);
            const sonrakiTamTatil = haftaTamamenTatilMi(sonrakiHaftaStr);
            if (rotasyonAktif && !sonrakiTamTatil) sayac++;
            haftaStr = sonrakiHaftaStr;
          }

          html += "</tbody></table>";
          icerik.innerHTML = html;
        } catch (err) {
          icerik.innerHTML = '<div style="color:#c5221f;padding:12px;">Hata: ' + err.message + "</div>";
        }
      }

      function tabloGoster() {
        const sayac = nobetVerisi.rotasyon_sayaci || 0;
        const slotlar = nobetVerisi.slotlar || [];
        const bas = new Date(nobetVerisi.hafta_baslangic + "T12:00:00");
        const bit = new Date(bas);
        bit.setDate(bas.getDate() + 4);
        const fmt = (d) =>
          d.toLocaleDateString("tr-TR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
          });
        document.getElementById("haftaTarih").textContent =
          fmt(bas) + " — " + fmt(bit);
        document.getElementById("sayacBilgi").textContent =
          sayac + ". rotasyon";
        const aktif = nobetVerisi.rotasyon_aktif !== false;
        document.getElementById("durumRozet").textContent = aktif
          ? "Rotasyon Aktif"
          : "Durduruldu";
        document.getElementById("durumRozet").className =
          "durum-rozet " + (aktif ? "durum-aktif" : "durum-durduruldu");
        document.getElementById("btnDurdur").textContent = aktif
          ? "Durdur"
          : "Başlat";

        const pozMap = {};
        slotlar.forEach((s) => {
          const p = pozHesapla(s, sayac, slotlar);
          pozMap[p.gi + "-" + p.ni] = s;
        });

        const gunDurumu = GUNLER.map((g, gi) => {
          const gunStr = haftaTarihEkle(nobetVerisi.hafta_baslangic, gi);
          if (OKUL_BASLANGIC && gunStr < OKUL_BASLANGIC) return "Dönem Dışı";
          if (OKUL_BITIS && gunStr > OKUL_BITIS) return "Dönem Dışı";
          const tatilAdi = gunTatilMi(gunStr);
          return tatilAdi ? "Tatil" : null;
        });

        let html =
          '<table class="nobet-tablo"><thead><tr><th>Nöbet Noktası</th>';
        GUNLER.forEach((g, gi) => {
          const gt = new Date(nobetVerisi.hafta_baslangic + "T12:00:00");
          gt.setDate(gt.getDate() + gi);
          html +=
            "<th>" +
            g +
            "<br><small>" +
            gt.toLocaleDateString("tr-TR", {
              day: "2-digit",
              month: "2-digit",
            }) +
            "</small></th>";
        });
        html += "</tr></thead><tbody>";
        NOKTALAR.forEach((nokta, ni) => {
          html += "<tr><td>" + nokta + "</td>";
          GUNLER.forEach((g, gi) => {
            if (gunDurumu[gi]) {
              html += '<td><div class="nobetci nobetci-bos">' + gunDurumu[gi] + "</div></td>";
              return;
            }
            const s = pozMap[gi + "-" + ni];
            if (s) {
              const sb = s.sabitlik || "serbest";
              const rz = sb === "sgn" ? "S-GN" : sb === "sabit_gun" ? "SABİT GÜN" : "";
              html +=
                '<td><div class="nobetci nobetci-' +
                sb +
                '">' +
                s.ogretmen_ad +
                (rz ? '<span class="rozet-k">' + rz + "</span>" : "") +
                "</div></td>";
            } else {
              html += '<td><div class="nobetci nobetci-bos">—</div></td>';
            }
          });
          html += "</tr>";
        });
        html += "</tbody></table>";
        document.getElementById("nobetTablosu").innerHTML = html;
      }

      function ogrChiplariGoster(filtre) {
        filtre = filtre || "";
        const yerlesikIds = new Set(editSlotlar.map((s) => s.ogretmen_id));
        document.getElementById("yerlesikSayac").textContent =
          "(" + yerlesikIds.size + "/" + ogretmenler.length + ")";
        const list = ogretmenler.filter(
          (o) =>
            !filtre ||
            (o.ad || "").toLowerCase().includes(filtre.toLowerCase()),
        );
        document.getElementById("ogrChiplar").innerHTML = list
          .map((o) => {
            const y = yerlesikIds.has(o.id);
            const s = seciliOgr && seciliOgr.id === o.id;
            return (
              '<span class="ogr-chip' +
              (y ? " yerlesik" : "") +
              (s ? " secili" : "") +
              '" onclick="ogrSec(\'' +
              o.id +
              "')\">" +
              (o.ad || "") +
              "</span>"
            );
          })
          .join("");
      }

      window.ogrAramaFiltrele = function () {
        ogrChiplariGoster(document.getElementById("ogrArama").value);
      };

      window.ogrSec = function (id) {
        var y = new Set(
          editSlotlar.map(function (s) {
            return s.ogretmen_id;
          }),
        );
        if (y.has(id)) return;
        var o = ogretmenler.find(function (x) {
          return x.id === id;
        });
        if (!o) return;
        seciliOgr =
          seciliOgr && seciliOgr.id === id ? null : { id: id, ad: o.ad };
        ogrChiplariGoster(document.getElementById("ogrArama").value);
      };

      function yerlesimGridGoster() {
        const yerlesikMap = {};
        editSlotlar.forEach((s) => {
          yerlesikMap[s.baslangic_slot] = s;
        });
        let html = '<div class="slot-grid">';
        GUNLER.forEach((g) => {
          html += '<div class="slot-gun-baslik">' + g + "</div>";
        });
        for (let ni = 0; ni < NOKTALAR.length; ni++) {
          for (let gi = 0; gi < 5; gi++) {
            const slot = posToSlot(gi, ni);
            const s = yerlesikMap[slot];
            const slotNo = slot + 1;
            if (s) {
              const sb = s.sabitlik || "serbest";
              html +=
                '<div class="slot-hucre dolu ' +
                sb +
                '" onclick="slotTikla(' +
                slot +
                ')">';
              html += '<div class="slot-no">' + slotNo + "</div>";
              html += '<div class="slot-isim">' + s.ogretmen_ad + "</div>";
              if (sb === "sgn")
                html += '<div style="font-size:9px;color:#888;">S-GN</div>';
              else if (sb === "sabit_gun")
                html += '<div style="font-size:9px;color:#888;">SABİT GÜN</div>';
              html += "</div>";
            } else {
              html +=
                '<div class="slot-hucre" onclick="slotTikla(' + slot + ')">';
              html += '<div class="slot-no">' + slotNo + "</div>";
              html += '<div class="slot-nokta">' + NOKTALAR[ni] + "</div>";
              html += "</div>";
            }
          }
        }
        html += "</div>";
        document.getElementById("yerlesimGrid").innerHTML = html;
      }

      window.slotTikla = function (slot) {
        var idx = editSlotlar.findIndex(function (s) {
          return s.baslangic_slot === slot;
        });
        if (idx >= 0) {
          editSlotlar.splice(idx, 1);
          seciliOgr = null;
          ogrChiplariGoster(document.getElementById("ogrArama").value);
          yerlesimGridGoster();
          return;
        }
        if (!seciliOgr) {
          mesaj("Önce öğretmen seçin.", "bilgi");
          return;
        }
        var sb = document.querySelector('input[name="sb"]:checked');
        var sabitlik = sb ? sb.value : "serbest";
        editSlotlar.push({
          ogretmen_id: seciliOgr.id,
          ogretmen_ad: seciliOgr.ad,
          sabitlik: sabitlik,
          baslangic_slot: slot,
        });
        seciliOgr = null;
        document.getElementById("sb-sgun").checked = true;
        ogrChiplariGoster(document.getElementById("ogrArama").value);
        yerlesimGridGoster();
      };

      window.noktalariKaydet = async function () {
        var inputs = document.querySelectorAll(
          '#noktaListesi input[type="text"]',
        );
        var liste = [];
        inputs.forEach(function (i) {
          var v = i.value.trim();
          if (v) liste.push(v);
        });
        if (!liste.length) {
          alert("En az 1 nokta olmalı.");
          return;
        }
        if (liste.length % 5 === 0) {
          const devam = confirm(
            "Nokta sayısı (" + liste.length + ") 5'e bölünüyor. Bu durumda bazı " +
            "noktalar hep aynı güne kilitlenip rotasyon çeşitliliği azalabilir. " +
            "Yine de kaydetmek istiyor musunuz?",
          );
          if (!devam) return;
        }
        await setDoc(doc(db, "nobet2_ayarlar", "noktalar"), {
          liste: liste,
          guncelleme: serverTimestamp(),
        });
        NOKTALAR = liste;
        modalKapat("noktaModal");
        tabloGoster();
        mesaj(liste.length + " nokta kaydedildi.", "basari");
      };

      window.modalKapat = function (id) {
        document.getElementById(id).classList.remove("aktif");
      };

      function mesaj(metin, tip) {
        var el = document.getElementById("mesajEl");
        el.textContent = metin;
        el.className = "mesaj-kayan mesaj-" + tip;
        el.style.display = "block";
        setTimeout(function () {
          el.style.display = "none";
        }, 3500);
      }

      onAuthStateChanged(auth, async function (user) {
        if (!user) {
          window.location.href = "/portal.html";
          return;
        }
        var ud = await getDoc(doc(db, "users", user.uid));
        if (!ud.exists()) {
          window.location.href = "/portal.html";
          return;
        }
        var rol = ud.data().rol;
        if (rol === "admin" || rol === "mudur_yardimcisi") {
          await init();
        } else if (rol === "ogretmen") {
          document.querySelector(".topbar-sag").style.display = "none";
          const ogSnap = await getDocs(
            query(collection(db, "teachers"), where("uid", "==", user.uid)),
          );
          const teacherId = ogSnap.empty ? null : ogSnap.docs[0].id;
          await ogretmenGorunumuYukle(teacherId);
        } else {
          document.getElementById("yukleniyor").textContent =
            "Erişim yetkiniz yok.";
        }
      });
    </script>
  </body>
</html>
